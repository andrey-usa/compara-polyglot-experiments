[dependencies]

[dev-dependencies.rustls]
default-features = false
features = ["aws-lc-rs"]
version = "0.23"

[dev-dependencies.similar-asserts]
version = "2"

[dev-dependencies.tokio]
features = ["macros"]
version = "1"

[dev-dependencies.webpki-ccadb]
version = "0.2.2"

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "The internal JVM support component of the rustls-platform-verifier crate. You shouldn't depend on this directly."
edition = "2021"
include = ["src/*"]
license = "MIT OR Apache-2.0"
name = "rustls-platform-verifier-android"
readme = false
repository = "https://github.com/rustls/rustls-platform-verifier"
version = "0.2.0"
