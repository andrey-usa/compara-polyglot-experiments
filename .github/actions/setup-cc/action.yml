name: Set up C and C++ compilers
description: >-
  Installs the pinned GCC and Clang releases and exports CC and CXX for the
  steps that follow.

# The C and C++ ports were built with whatever the runner image shipped as `cc`
# and `clang++`: on ubuntu-24.04 that is gcc 13 and clang 18, three and four
# major releases behind upstream, while the Rust port builds with the LLVM of the
# current stable toolchain and Zig with its pinned release. A benchmark between
# ports should not be a benchmark between compiler vintages, so the versions are
# written down here, once, the way setup-zig pins Zig.
#
# GCC comes from the Ubuntu toolchain PPA and Clang from apt.llvm.org, the
# LLVM project's own repository -- the two places those releases are packaged
# for Ubuntu. Linux x86-64 runners only; the portability workflows keep their
# own compilers on purpose.

inputs:
  gcc:
    description: GCC major release, used as CC.
    required: false
    default: "16"
  llvm:
    description: LLVM major release, whose clang++ is used as CXX.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Install gcc-${{ inputs.gcc }} and clang-${{ inputs.llvm }}
      shell: bash
      run: |
        set -euo pipefail
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-${{ inputs.llvm }} main" \
          | sudo tee /etc/apt/sources.list.d/llvm-${{ inputs.llvm }}.list >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          gcc-${{ inputs.gcc }} g++-${{ inputs.gcc }} clang-${{ inputs.llvm }}
        echo "CC=gcc-${{ inputs.gcc }}" >> "$GITHUB_ENV"
        echo "CXX=clang++-${{ inputs.llvm }}" >> "$GITHUB_ENV"

    - name: Check they run
      shell: bash
      run: |
        # GITHUB_ENV, like GITHUB_PATH, only reaches later steps.
        "gcc-${{ inputs.gcc }}" --version | head -1
        "clang++-${{ inputs.llvm }}" --version | head -1
