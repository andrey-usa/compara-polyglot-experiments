# Actual Budget e2e desktop-core batch (rules, schedules, budget, transactions,
# accounts - 45 upstream tests) converted from Playwright to primavera (.pv),
# against actualbudget/actual @ dff6b4b21bed7d20a0977cd71c990f40b6e26e8e.
# primavera @ 2ee2589cb8d481e120d1808f79a428dda93227b7, navigera @
# 35ff0103cc2539cec5e97c60d73962d219d58465 (public repos). Same container and
# app start as the Playwright baseline; per-test results via junit.xml.
# Standard GitHub-hosted runner; no secrets; no paid calls.
# Supplemental theme-screenshot scenarios (*.supp.pv) are NOT upstream coverage
# and are excluded from this run.
name: actual-pv-batch-a
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  batch-a:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Clone actual @ pinned commit
        run: |
          git clone --filter=blob:none https://github.com/actualbudget/actual.git actual
          cd actual && git checkout dff6b4b21bed7d20a0977cd71c990f40b6e26e8e
      - name: Trust the repository directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/actual"
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'actual/.nvmrc'
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: cd actual && yarn install --immutable
      - name: Build browser bundle (CI parity)
        env:
          REACT_APP_NETLIFY: 'true'
        run: cd actual && yarn build:browser --skip-translations
      - name: Install Rust (for the primavera source build)
        run: |
          command -v cc >/dev/null || { apt-get update && apt-get install -y --no-install-recommends build-essential; }
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build primavera + navigera @ pinned commits
        run: |
          git clone --filter=blob:none https://github.com/andrey-usa/navigera.git navigera
          git -C navigera checkout 35ff0103cc2539cec5e97c60d73962d219d58465
          git clone --filter=blob:none https://github.com/andrey-usa/primavera.git primavera
          git -C primavera checkout 2ee2589cb8d481e120d1808f79a428dda93227b7
          CARGO_TARGET_DIR="$RUNNER_TEMP/pv-target" cargo build --release --manifest-path primavera/Cargo.toml
          echo "$RUNNER_TEMP/pv-target/release" >> "$GITHUB_PATH"
      - name: Resolve a browser for primavera
        run: |
          B="$(find /ms-playwright -maxdepth 4 -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) 2>/dev/null | sort | head -1)"
          if [ -n "$B" ]; then
            echo "using preinstalled browser: $B"
            echo "CHROME_BIN=$B" >> "$GITHUB_ENV"
          else
            echo "no preinstalled browser under /ms-playwright; falling back to primavera navigera install-browser (chrome-headless-shell download, same container)"
            primavera navigera install-browser
          fi
      - name: Apply the click stable-box patch, run its test, build the patched primavera
        run: |
          git -C navigera apply "$GITHUB_WORKSPACE/batch-a/navigera-click-stable-box.patch"
          git -C navigera diff --stat
          NAVIGERA_REQUIRE_BROWSER=1 CARGO_TARGET_DIR="$RUNNER_TEMP/nv-test-target" cargo test --release --manifest-path navigera/Cargo.toml --test interactions a_click_waits_for_a_moving_target_to_stop
          CARGO_TARGET_DIR="$RUNNER_TEMP/pv-target-patched" cargo build --release --manifest-path primavera/Cargo.toml
      - name: Start the app (baseline's server)
        run: |
          PORT=3001 node actual/packages/desktop-client/bin/serve-build.mjs > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3001/ && break || sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:3001/
      - name: Assert the browser really runs
        run: |
          if [ -n "$CHROME_BIN" ]; then test -x "$CHROME_BIN" || { echo "CHROME_BIN not executable: $CHROME_BIN"; exit 1; }; fi
          printf 'base http://127.0.0.1:3001\nscenario "probe"\n  goto /\n  expect text "Try the demo" --timeout-ms 30000\n' > /tmp/probe.pv
          primavera run /tmp/probe.pv | tee probe.log
          grep -q "1 passed" probe.log || { echo "browser probe did not execute"; exit 1; }
      - name: Rerun the sidebar context-menu test twice (G5 follow-up)
        working-directory: batch-a/actual-pv
        run: |
          mkdir -p results
          primavera run pv/accounts.pv --grep "right clicking an account in sidebar" --repeat 2 --junit results/sidebar-junit.xml --evidence results/evidence > results/sidebar-rerun.log 2>&1 || P=$?
          cat results/sidebar-rerun.log
          echo "sidebar rerun rc=$P (recorded here; the batch gate below is authoritative)"
      - name: Rerun the running-balance test twice (guarded-save verification)
        working-directory: batch-a/actual-pv
        run: |
          mkdir -p results
          primavera run pv/accounts.pv --grep "updates the running balance" --repeat 2 --junit results/running-balance-junit.xml --evidence results/evidence > results/running-balance-rerun.log 2>&1 || P=$?
          cat results/running-balance-rerun.log
          echo "running-balance rerun rc=$P (non-gating; the batch gate below is authoritative)"
      - name: "Measure the by-payee race (literal port, --repeat 10)"
        working-directory: batch-a/actual-pv
        run: |
          mkdir -p results
          primavera run pv/transactions.pv --grep "filters transactions by payee" --repeat 10 --junit results/by-payee-measure-junit.xml --evidence results/evidence > results/by-payee-measure.log 2>&1 || P=$?
          cat results/by-payee-measure.log
          echo "by-payee measurement rc=$P (non-gating frequency measurement)"
      - name: "Control - by-payee with a 1-frame wait before Apply (--repeat 10)"
        working-directory: batch-a/actual-pv
        run: |
          mkdir -p results
          primavera run pv/controls-by-payee-1frame.pv --repeat 10 --junit results/by-payee-control-junit.xml --evidence results/evidence > results/by-payee-control.log 2>&1 || P=$?
          cat results/by-payee-control.log
          echo "by-payee control rc=$P (non-gating pacing control)"
      - name: "Measure by-payee with the patched click (--repeat 10)"
        working-directory: batch-a/actual-pv
        run: |
          mkdir -p results
          "$RUNNER_TEMP/pv-target-patched/release/primavera" run pv/transactions.pv --grep "filters transactions by payee" --repeat 10 --junit results/by-payee-patched-junit.xml --evidence results/evidence > results/by-payee-patched.log 2>&1 || P=$?
          cat results/by-payee-patched.log
          echo "patched by-payee rc=$P (non-gating patched measurement)"
      - name: "Click latency on a static button, before vs after (20 tries each: isolated click + end-to-end try)"
        run: |
          mkdir -p batch-a/actual-pv/results
          python3 -m http.server 8123 --directory batch-a/bench &>/dev/null &
          SRV=$!
          sleep 1
          primavera run batch-a/bench/click-cost.pv --repeat 20 --reporter jsonl > batch-a/actual-pv/results/click-cost-before.jsonl 2>&1 || true
          "$RUNNER_TEMP/pv-target-patched/release/primavera" run batch-a/bench/click-cost.pv --repeat 20 --reporter jsonl > batch-a/actual-pv/results/click-cost-after.jsonl 2>&1 || true
          kill $SRV || true
          for f in before after; do
            echo "click-cost $f (isolated click latency, eval-bracketed):"
            jq -r 'select(.event=="scenario") | .saved.delta // empty' batch-a/actual-pv/results/click-cost-$f.jsonl | sort -n | awk '{a[NR]=$1} END{printf "  n=%d median=%.1fms min=%.1f max=%.1f\n", NR, a[int((NR+1)/2)], a[1], a[NR]}'
            echo "click-cost $f (end-to-end goto+click try latency):"
            jq -r 'select(.event=="scenario") | .ms' batch-a/actual-pv/results/click-cost-$f.jsonl | sort -n | awk '{a[NR]=$1} END{printf "  n=%d median=%.1fms min=%.1f max=%.1f\n", NR, a[int((NR+1)/2)], a[1], a[NR]}'
          done
      - name: Run the converted batch (per-test results)
        if: ${{ !contains(github.event.head_commit.message, '[skip-batch]') }}
        working-directory: batch-a/actual-pv
        run: |
          mkdir -p results
          primavera run pv/rules.pv pv/schedules.pv pv/budget.pv pv/transactions.pv pv/accounts.pv --retries 1 --junit results/junit.xml --evidence results/evidence > results/batch-a-run.log 2>&1 || P=$?
          cat results/batch-a-run.log
          ! grep -q "scenarios not run" results/batch-a-run.log || { echo "batch did not execute"; exit 1; }
          T=$(grep -c "<testcase " results/junit.xml || true)
          F=$(grep -cE "<(failure|error)[ >]" results/junit.xml || true)
          R=$(grep -c "FLAKY" results/batch-a-run.log || true)
          echo "junit: $T testcases, $F failures/errors, $R flaky (pass-on-retry)"
          [ "$T" -eq 45 ] || { echo "expected 45 testcases, got $T"; exit 1; }
          [ "$F" -eq 0 ] && [ "$P" -eq 0 ] || { echo "failures/errors present (primavera rc=$P) - see junit + evidence artifacts"; exit 1; }
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: actual-pv-batch-a-results
          path: |
            batch-a/actual-pv/results/
            app.log
            probe.log
          retention-days: 30
