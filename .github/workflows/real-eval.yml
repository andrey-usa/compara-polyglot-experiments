name: real-eval

# REAL (agisdk) model-driven tool comparison: the fixed 31-task subset,
# one job per tool (navigera vs agent-browser), same model and prompt
# loop. Protocol and pins: bench/real/README.md.
#
# Model: deepseek-ai/DeepSeek-V4.1-Flash via SiliconFlow
# (https://api.siliconflow.com/v1), key in the `main` environment as
# SILICONFLOW_API_KEY. Per-cell computed-cost guard (--max-spend,
# default $2.49); two cells fit the $5 combined budget. Computed cost
# is usage x listed prices, not provider-billed spend.
#
# Navigera is built from the experiment-17 candidate tree @ e9c1b57 in
# full (ancestry-checked); agent-browser is npm agent-browser@0.39.1.
# No account, no key in any file or log, no leaderboard submission.

on:
  push:
    branches: [experiment-27]
    paths:
      - bench/real/**
      - .github/workflows/real-eval.yml
  workflow_dispatch:
    inputs:
      tools:
        description: "comma-separated: navigera,agent-browser"
        default: "navigera,agent-browser"
      count:
        description: "tasks per cell"
        default: "31"
      offset:
        description: "start at this index into tasks.json"
        default: "0"
      max_spend:
        description: "per-cell budget in USD (computed-ledger stop)"
        default: "2.49"

permissions:
  contents: read

jobs:
  eval:
    name: REAL (${{ matrix.tool }} x V4.1-Flash)
    strategy:
      fail-fast: false
      matrix:
        tool: [navigera, agent-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: main
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      TOOL: ${{ matrix.tool }}
      COUNT: ${{ inputs.count || '31' }}
      OFFSET: ${{ inputs.offset || '0' }}
      MAX_SPEND: ${{ inputs.max_spend || '2.49' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        if: matrix.tool == 'navigera'
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.tool == 'agent-browser'
        with:
          node-version: 24
      - name: Build navigera (release)
        if: matrix.tool == 'navigera'
        run: |
          git fetch --depth 10 origin experiment-17
          git merge-base --is-ancestor e9c1b57 FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/nav-build"
          git archive e9c1b57 navigera | tar -x -C "$RUNNER_TEMP/nav-build"
          mv "$RUNNER_TEMP/nav-build/navigera" "$RUNNER_TEMP/nav-build/src"
          echo "candidate provenance: $(git rev-parse e9c1b57)"
          cd "$RUNNER_TEMP/nav-build/src"
          cargo build --release --locked --bin navigera
          echo "NAV_BIN=$RUNNER_TEMP/nav-build/src/target/release/navigera" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/nav-build/src/target/release/navigera" --version
          "$RUNNER_TEMP/nav-build/src/target/release/navigera" install-skill --dir "$RUNNER_TEMP/skills"
          echo "NAVIGERA_SKILL_MD=$RUNNER_TEMP/skills/navigera/SKILL.md" >> "$GITHUB_ENV"
      - name: Install agent-browser
        if: matrix.tool == 'agent-browser'
        run: |
          npm install -g agent-browser@0.39.1
          echo "AB_BIN=$(npm prefix -g)/bin/agent-browser" >> "$GITHUB_ENV"
          agent-browser --version
      - name: Chrome
        run: google-chrome --version
      - name: REAL subset matrix slice
        run: |
          python3 bench/real/real_run.py --tool "$TOOL" --tasks-file bench/real/tasks.json \
            --count "$COUNT" --offset "$OFFSET" --seeds 1 --max-spend "$MAX_SPEND" \
            --run-id "real-$TOOL" \
            --nav-bin "${NAV_BIN:-navigera}" --ab-bin "${AB_BIN:-agent-browser}" --out out/real
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-eval-${{ matrix.tool }}
          path: out/real/
          if-no-files-found: ignore
