name: CI (Rust)

permissions:
  contents: read

on:
  push:
    # `main` only. Every branch here gets a pull request, and a branch listed
    # beside it means each push runs this workflow twice on the same SHA -- once
    # for the push, once for the pull_request -- which the per-ref concurrency
    # group cannot collapse, because a push is `refs/heads/...` and a pull
    # request is `refs/pull/N/merge`. The `pull_request` trigger below covers
    # the branch; this one covers what landed.
    branches: [main]
    paths: ["rust/**", "tests/fixtures/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths: ["rust/**", "tests/fixtures/**", ".github/workflows/ci-rust.yml"]
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    # The tests read `../tests/fixtures`, the set every port is held to, so they
    # run from `rust/` in a full checkout and not from a copy of the crate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked --release

  engines-agree:
    name: every engine, CSV and TSV, identical answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --locked --release --all-features
      - name: Generate 200k rows a side, as CSV and as TSV
        run: |
          ./target/release/compara-gen-data --rows 200k --out-dir data
          ./target/release/compara-gen-data --rows 200k --out-dir data --format tsv
      # The same rows with a different separator must give the same counts,
      # column statistics and row files on every engine: the separator is read
      # from the header line, and nothing downstream of the scan may know it.
      - name: Compare with every engine, both separators
        run: |
          for f in csv tsv; do
            for e in turbo sortmerge native; do
              code=0
              ./target/release/compara compare data/200k_a.$f data/200k_b.$f \
                -k account_id,txn_id -i updated_at --engine $e \
                -o /tmp/$e-$f.html --json /tmp/$e-$f.json --export-dir /tmp/x-$e-$f || code=$?
              [ "$code" = 1 ] || { echo "::error::$e on $f exited $code, expected 1 (differences found)"; exit 1; }
            done
          done
          python3 - <<'PY'
          import filecmp, json, os, sys
          ref = json.load(open("/tmp/turbo-csv.json"))
          names = sorted(os.listdir("/tmp/x-turbo-csv"))
          for f in ("csv", "tsv"):
              for e in ("turbo", "sortmerge", "native"):
                  n = json.load(open(f"/tmp/{e}-{f}.json"))
                  for section in ("counts", "columns"):
                      if n[section] != ref[section]:
                          sys.exit(f"{e} on {f}: {section} differ from turbo on csv")
                  for name in names:
                      if not filecmp.cmp(f"/tmp/x-turbo-csv/{name}", f"/tmp/x-{e}-{f}/{name}", shallow=False):
                          sys.exit(f"{e} on {f}: {name} differs from turbo on csv")
          print("3 engines x 2 separators agree:", json.dumps(ref["counts"]))
          PY
      - name: The report is self-contained
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("/tmp/turbo-csv.html", encoding="utf-8").read()
          external = re.search(r'(?:src|href)="(?!#)([^"]+)"', html)
          if external:
              sys.exit(f"report references an external resource: {external.group(1)}")
          if len(html) >= 8_000_000:
              sys.exit(f"report unexpectedly large: {len(html)}")
          print(f"report: {len(html) // 1024} KB, no external references")
          PY
      - name: Benchmark harness, 10k rows
        run: ./target/release/compara-bench --rows 10k --engine turbo --out-dir bench
      - uses: actions/upload-artifact@v7
        with:
          name: report-rust-10k
          path: |
            rust/bench/10k-*.html
            rust/bench/10k-*.json
          retention-days: 14

  audit:
    # Known-vulnerable dependencies (RustSec advisory database).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  msrv:
    # The oldest Rust that builds the port (rust-version in Cargo.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache: false
      - run: cargo check --locked --all-targets

  windows-readme:
    name: the README's Windows commands
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The README hands a Windows reader these commands, in this order, and
      # says to run them from the repository root, so this step runs them as
      # written, from the root -- note `working-directory` overriding the
      # workflow default -- so the two cannot drift apart.
      - name: Run the README's Windows commands, from the repository root
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          # A compare exits 1 by design, and two things in GitHub's pwsh would
          # turn that into a failed step: from PowerShell 7.4 a native command's
          # non-zero exit throws under `$ErrorActionPreference = 'stop'`, which
          # the wrapper sets; and the wrapper appends `exit $LASTEXITCODE`. So
          # opt out of the first and end with an explicit `exit 0`.
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --release --manifest-path rust\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the README's build line exited $LASTEXITCODE" }
          rust\target\release\compara-gen-data.exe --rows 10k --out-dir data --prefix demo
          if ($LASTEXITCODE -ne 0) { throw "compara-gen-data exited $LASTEXITCODE" }
          rust\target\release\compara.exe compare data\demo_a.csv data\demo_b.csv `
              -k account_id,txn_id -i updated_at
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 (differences found), got $LASTEXITCODE" }
          rust\target\release\compara.exe compare data\demo_a.csv data\demo_b.csv `
              -k account_id,txn_id -i updated_at -o report.html
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 (differences found), got $LASTEXITCODE" }
          if (-not (Select-String -Path report.html -Pattern 'compara' -Quiet)) { throw "report.html was not written" }
          exit 0
