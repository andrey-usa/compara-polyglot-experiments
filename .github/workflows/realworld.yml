name: Real-world files (ports and contenders)

permissions:
  contents: read

# Every other benchmark here reads files this project's own generator wrote,
# and its Parquet is all strings. This one writes the same rows the way pyarrow,
# Polars, DuckDB and pandas write them by default -- typed columns, each writer's
# own codec, encoding and row groups -- plus the CSV as TSV, and asks every port
# and DuckDB, Polars and pandas the same question on every file. Every answer is
# held to the Rust port's on the CSV, and the Rust port must read every file:
# that is the failure condition. A port that refuses a file is recorded as
# refusing it, which is a result, not a failure. See scripts/realworld.py.
#
# The contenders are installed at their latest release on every run, so the
# table measures what a user would install today.

on:
  pull_request:
    paths:
      - "scripts/realworld.py"
      - "scripts/contenders.py"
      - ".github/workflows/realworld.yml"
  schedule:
    # Weekly, so a contender's new release shows up without anybody asking.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      rows:
        description: "Rows a side: 1m, 10m ..."
        default: "1m"
      repeats:
        description: "Runs per tool and file; the best is kept"
        default: "3"
      threads:
        description: "Threads for every tool (empty: what each picks)"
        default: ""

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realworld:
    name: real-world files, every tool
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A pull request only has to show the harness still works.
      ROWS: ${{ github.event.inputs.rows || (github.event_name == 'pull_request' && '200k') || '1m' }}
      REPEATS: ${{ github.event.inputs.repeats || '3' }}
      THREADS: ${{ github.event.inputs.threads || '' }}
    steps:
      - uses: actions/checkout@v7
      # 3.13 rather than the 3.14 the other workflows pin: this job installs
      # pyarrow, Polars and DuckDB from wheels, and the newest interpreter is
      # the one a fresh release of any of them is most likely to lack.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Zig
        uses: ./.github/actions/setup-zig
      - name: Install C and C++ compilers
        uses: ./.github/actions/setup-cc

      - name: What this runner is
        run: |
          {
            echo "## Real-world files — host"
            echo
            echo '```'
            grep -m1 "model name" /proc/cpuinfo
            echo "cores: $(nproc)"
            free -g | head -2
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the four ports
        run: scripts/build_ports.sh c cpp rust zig

      - name: Install the writers and contenders (latest)
        run: |
          python3 -m pip install --upgrade pyarrow polars duckdb pandas
          python3 -c "import pyarrow, polars, duckdb, pandas; print('pyarrow', pyarrow.__version__, '| polars', polars.__version__, '| duckdb', duckdb.__version__, '| pandas', pandas.__version__)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the table
        run: |
          threads=""
          if [ -n "$THREADS" ]; then
            threads="--threads $THREADS"
          fi
          python3 scripts/realworld.py --rows "$ROWS" --repeats "$REPEATS" $threads \
            --data-dir "$RUNNER_TEMP/realworld" \
            --md-out /tmp/realworld.md --json-out /tmp/realworld.json \
            | tee /tmp/realworld.txt

      - name: Publish the table
        if: always()
        run: |
          {
            echo "## $ROWS rows a side"
            echo
            if [ -s /tmp/realworld.md ]; then
              cat /tmp/realworld.md
            else
              echo "_No table: the run did not get that far. Its log is below._"
            fi
            echo
            echo "<details><summary>full log</summary>"
            echo
            echo '```'
            cat /tmp/realworld.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: realworld-${{ github.run_id }}
          path: |
            /tmp/realworld.txt
            /tmp/realworld.md
            /tmp/realworld.json
          retention-days: 30
