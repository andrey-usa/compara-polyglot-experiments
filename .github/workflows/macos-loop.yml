name: macOS full-suite loop, two test threads

# Every macOS-only stall so far is a page that stops answering for 35 s or
# more: a goto/wizard load waited out, a select evaluate stalled 105 s, a
# tab back as about:blank after show. They appear about once in 10
# full-suite loops, never in a single test alone, and the earlier loops ran
# three tests at once on the runner's three cores.
#
# This workflow runs the whole macOS test list exactly as the Interactions
# workflow runs it -- --lib, interactions, handoff, attach, commands, fork,
# verify_scopes, no-fail-fast -- 10 sequential times on macos-14, against
# the navigera copy in `navigera/`, with two tests at a time
# (RUST_TEST_THREADS=2), no retries of failed loops, and no whole-loop
# retries. Each loop writes its own log under `navigera/runs/`; a watchdog
# (1500 s per loop) kills and names any test past 60 s. During each loop
# the 1-minute load average is sampled every 30 s (max and median reported
# per loop), the suite wall time is recorded per loop, and lines showing a
# CDP wait of 35 s or more are grepped into a per-loop stalls file.
# Results are the artifact `macos-full-suite-loop-two-threads`, carrying
# runs/counts.txt, per-loop logs, load samples, wall times, and stalls
# files. A watchdog kill stops the loop at once.

on:
  # No branch filter: this file exists only on the branch it was pushed to,
  # so a push trigger here fires only for that branch's push.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  loop:
    name: "interactions macos-14 full-suite loop, two test threads"
    runs-on: macos-14
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: navigera
    env:
      NAVIGERA_REQUIRE_BROWSER: "1"
      NAVIGERA_TRACE_EFFECT: "1"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Chrome
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
      - name: Build tests once
        run: cargo test --locked --no-run --lib --test interactions --test handoff --test attach --test commands --test fork --test verify_scopes
      - name: Loop full suite 10 times
        run: |
          mkdir -p runs
          echo "threads: 2" > runs/threads.txt
          : > runs/summary.tsv
          : > runs/wall.tsv
          # A watchdog under the job's timeout: a hung test is killed and named
          # in the annotation (the job log isn't readable from everywhere).
          cat > watchdog.py <<'PY'
          import os, signal, subprocess, sys
          log, limit, cmd = sys.argv[1], int(sys.argv[2]), sys.argv[3:]
          with open(log, "w", encoding="utf-8", errors="replace") as f:
              p = subprocess.Popen(cmd, stdout=f, stderr=subprocess.STDOUT, start_new_session=(os.name != "nt"))
              try:
                  code = p.wait(timeout=limit)
              except subprocess.TimeoutExpired:
                  if os.name != "nt":
                      os.killpg(p.pid, signal.SIGKILL)
                  else:
                      p.kill()
                  p.wait()
                  code = 124
                  f.write(f"\nWATCHDOG: killed after {limit} s\n")
          sys.stdout.write(open(log, encoding="utf-8", errors="replace").read())
          sys.exit(code)
          PY
          cat > stalls.py <<'PY'
          """Every op of 35 s or more in a loop log, however navigera or cargo printed
          it: JSON `"elapsed_ms":N`, `N ms` / `timed out after N ms`, "CDP command
          timed out", cargo's "has been running for over N seconds", a watchdog kill.
          One line of the log is one op. usage: stalls.py <loop log> [<loop id>]
          prints `loop<TAB>test<TAB>op<TAB>seconds<TAB>line` per op."""
          import re
          import sys

          OP_MS = 35000


          def ops(text):
              test = ""
              for line in text.splitlines():
                  m = re.match(r"---- (\S+) stdout ----", line)
                  if m:
                      test = m.group(1)
                      continue
                  m = re.match(r"^test (\S+) has been running for over (\d+) seconds", line)
                  if m:
                      yield m.group(1), "(whole test)", int(m.group(2)), line
                      continue
                  if "WATCHDOG" in line:
                      yield "(whole run)", "(watchdog)", None, line
                      continue
                  ms = [float(x) for x in re.findall(r'"elapsed_ms"\s*:\s*([0-9.]+)', line)]
                  if not ms:
                      ms = [float(x) for x in re.findall(r"\b(\d{5,}(?:\.\d+)?)\s*ms\b", line)]
                  big = [x for x in ms if x >= OP_MS]
                  if big or "CDP command timed out" in line:
                      op = re.match(r"^\s*(\[[^\]]*\])\s+failed", line)
                      seconds = round(max(big) / 1000, 1) if big else None
                      yield test, op.group(1) if op else "", seconds, line


          if __name__ == "__main__":
              loop = sys.argv[2] if len(sys.argv) > 2 else "-"
              for test, op, seconds, line in ops(open(sys.argv[1], encoding="utf-8", errors="replace").read()):
                  print(f"{loop}\t{test}\t{op}\t{seconds}\t{line.strip()[:300]}")
          PY
          hang=""
          for i in $(seq -w 1 10); do
            log="runs/loop-${i}.log"
            echo "=== loop $i $(date -u +%FT%TZ) ===" > "$log.tmp"
            # Sample the 1-minute load average every 30 s while the loop runs.
            ( while true; do
                echo "$(date -u +%FT%TZ) $(sysctl -n vm.loadavg 2>/dev/null || uptime)"
                sleep 30
              done ) > "runs/load-${i}.txt" 2>/dev/null &
            sampler=$!
            start=$(date +%s)
            set +e
            python3 watchdog.py "$log" 1500 cargo test --locked --no-fail-fast --lib --test interactions --test handoff --test attach --test commands --test fork --test verify_scopes
            code=$?
            kill $sampler 2>/dev/null || true
            wait $sampler 2>/dev/null || true
            set -e
            end=$(date +%s)
            printf '%s\t%s\n' "$i" "$((end - start))" >> runs/wall.tsv
            # Prepend the loop header (watchdog.py rewrites the log file).
            { cat "$log.tmp"; cat "$log"; } > "$log.new" && mv "$log.new" "$log" && rm "$log.tmp"
            printf '%s\t%s\n' "$i" "$code" >> runs/summary.tsv
            echo "=== loop $i exit $code wall $((end - start)) s ===" >> "$log"
            # Every op of 35 s or more, however it was printed (JSON
            # "elapsed_ms", "N ms", "CDP command timed out"), slow tests and
            # watchdog kills: loop, test, op, seconds, line.
            python3 stalls.py "$log" "$i" > "runs/stalls-${i}.txt" || true
            python3 - "$log" "interactions macos loop $i" <<'PY' || true
          import re, sys
          WATCH = {"a_covered_element_is_not_clicked_unless_forced", "locators_reach_into_same_origin_frames",
                   "downloads_are_saved_and_waited_for", "a_click_waits_for_a_sliding_modal_to_settle"}
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          passed = sum(int(m) for m in re.findall(r"test result: \w+\. (\d+) passed", text))
          failed = re.findall(r"^test (\S+) \.\.\. FAILED", text, re.M)
          ran = re.findall(r"^test (\S+) \.\.\. (ok|FAILED)", text, re.M)
          handoff = [f"{n}: {r}" for n, r in ran if r == "FAILED" or n in WATCH]
          panics = re.findall(r"panicked at .*?\n(.*?)\n", text, re.S)
          msg = f"{passed} passed, {len(failed)} failed {failed}\n" + "\n".join(handoff)
          slow = re.findall(r"^test (\S+) has been running for over \d+ seconds", text, re.M)
          if slow:
              msg += "\nslow: " + ", ".join(slow)
          if "WATCHDOG: killed" in text:
              msg += "\nWATCHDOG killed the run; last lines:\n" + "\n".join(text.strip().splitlines()[-25:])
          if panics:
              msg += "\n" + "\n".join(p[:600] for p in panics[:4])
          print(f"::notice title={sys.argv[2]}::" + msg[:3800].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            if [ "$code" = "124" ]; then
              hang="$i"
              echo "HANG in loop $i: watchdog killed the run; stopping the loop" | tee runs/hang.txt
              break
            fi
          done
          python3 - runs/summary.tsv runs/wall.tsv <<'PY'
          import re, statistics, sys
          rows = [l.rstrip("\n").split("\t") for l in open(sys.argv[1]) if l.strip()]
          walls = {}
          try:
              for l in open(sys.argv[2]):
                  if l.strip():
                      k, v = l.rstrip("\n").split("\t")
                      walls[k] = int(v)
          except OSError:
              pass
          lines = [f"loops run: {len(rows)}"]
          all_ops = []
          total_passed, total_failed = 0, 0
          for i, _code in rows:
              try:
                  text = open(f"runs/loop-{i}.log", encoding="utf-8", errors="replace").read()
              except OSError:
                  text = ""
              passed = sum(int(m) for m in re.findall(r"test result: \w+\. (\d+) passed", text))
              failed = re.findall(r"^test (\S+) \.\.\. FAILED", text, re.M)
              total_passed += passed
              total_failed += len(failed)
              loads = []
              try:
                  for l in open(f"runs/load-{i}.txt", encoding="utf-8", errors="replace"):
                      m = re.search(r"\{\s*([0-9.]+)\s+[0-9.]+\s+[0-9.]+\s*\}", l)
                      if m:
                          loads.append(float(m.group(1)))
              except OSError:
                  pass
              load = f"load max {max(loads):.2f} median {statistics.median(loads):.2f} (n={len(loads)})" if loads else "load n/a"
              wall = f"wall {walls[i]} s" if i in walls else "wall n/a"
              try:
                  stalls = [l.rstrip("\n") for l in open(f"runs/stalls-{i}.txt", encoding="utf-8", errors="replace") if l.strip()]
              except OSError:
                  stalls = []
              # stalls.py wrote one line per op of 35 s or more:
              # loop, test, op, seconds, the log line.
              ops = [s.split("\t") for s in stalls]
              lines.append(f"loop {i}: {passed} passed, {len(failed)} failed {failed}, {wall}, {load}, ops >= 35 s: {len(ops)}")
              for o in ops:
                  test, op, sec = (o + ["", "", ""])[1:4]
                  lines.append(f"  op >= 35 s: {sec} s  {test}  {op}")
                  all_ops.append((i, test, op, sec))
          lines.append(f"total: {total_passed} passed, {total_failed} failed")
          real = [o for o in all_ops if o[2] not in ("(whole test)", "(watchdog)")]
          timed = [float(o[3]) for o in real if o[3] not in ("", "None")]
          lines.append(f"ops >= 35 s: {len(real)} (with a time: {len(timed)}); over 45 s: {sum(t > 45 for t in timed)}"
                       + (f"; longest {max(timed):.1f} s" if timed else "")
                       + f"; tests over 60 s: {sum(o[2] == '(whole test)' for o in all_ops)}; watchdog kills: {sum(o[2] == '(watchdog)' for o in all_ops)}")
          open("runs/counts.txt", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cat runs/counts.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$hang" ]; then
            echo "loop stopped on watchdog hang in loop $hang" >&2
            exit 124
          fi
          test -z "$(awk -F '\t' '$2 != 0' runs/summary.tsv)"
      - name: Upload run logs and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-full-suite-loop-two-threads
          path: |
            navigera/runs/
            navigera/failure-*.png
          if-no-files-found: warn

  canvas-alone:
    name: "canvas test alone, up to 50 runs, stop at 2 failures"
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: navigera
    env:
      NAVIGERA_REQUIRE_BROWSER: "1"
      NAVIGERA_TRACE_EFFECT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Chrome
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
      - name: Build tests once
        run: cargo test --locked --no-run --test interactions
      - name: Loop the canvas test alone
        run: |
          mkdir -p runs
          : > runs/canvas-alone-summary.tsv
          fails=0
          ran=0
          for i in $(seq -w 1 50); do
            ran=$((ran + 1))
            log="runs/canvas-alone-${i}.log"
            set +e
            cargo test --locked --test interactions the_mouse_goes_where_it_is_told_on_a_canvas > "$log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$i" "$code" >> runs/canvas-alone-summary.tsv
            if [ "$code" != "0" ]; then
              fails=$((fails + 1))
              { echo "=== run $i FAILED ==="; grep -A 3 "the line is drawn" "$log" || true; } >> runs/canvas-alone-failures.txt
            fi
            if [ "$fails" -ge 2 ]; then break; fi
          done
          { echo "canvas alone: $ran runs, $fails failures"; cat runs/canvas-alone-summary.tsv; } >> "$GITHUB_STEP_SUMMARY"
          echo "canvas alone: $ran runs, $fails failures"
          test "$fails" = "0"
      - name: Upload canvas-alone logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-canvas-alone-loop
          path: |
            navigera/runs/canvas-alone-*
            navigera/failure-*.png
          if-no-files-found: warn
