name: release

# Prebuilt binaries for Linux x86_64/aarch64 (glibc 2.28 and later), macOS
# arm64/x86_64 and Windows x64, attached to a GitHub release, then the same
# binaries repackaged for crates.io, npm, PyPI, Homebrew and Scoop.
#
# Releasing: Actions -> release -> Run workflow on main with the version
# from Cargo.toml (e.g. 0.5.0). The run checks that the version matches
# Cargo.toml, builds every target, tags v<version> on that commit and creates
# the release. Pushing a v* tag works too. Running it again for a version
# whose tag exists rebuilds that tag, replaces the release's files and
# publishes to any registry that doesn't have that version yet.
#
# Each registry is switched on by a repository variable (Settings -> Secrets
# and variables -> Actions -> Variables), once its trusted publisher exists:
#   PUBLISH_CRATES=true  PUBLISH_NPM=true  PUBLISH_PYPI=true
#   HOMEBREW_TAP=<owner>/homebrew-tap  SCOOP_BUCKET=<owner>/scoop-bucket
#   (the last two push with the secret TAP_TOKEN)
# Switched off, the packages are still built and installed in the
# `packages` job, so a dry run checks them too.

on:
  push:
    tags: ["v*"]
    # Dry run: pushing a `release-test/*` branch builds and packages every
    # target without publishing anything.
    branches: ["release-test/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, as in Cargo.toml (e.g. 0.5.0); tags this commit v<version>"
        required: true
      publish:
        description: "publish (off = dry run: build and package only)"
        type: boolean
        default: true

# Read-only by default; only the job that creates the release can write.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
      publish: ${{ steps.p.outputs.publish }}
      prerelease: ${{ steps.p.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          fail() { echo "::error title=release::$1"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"; publish="$INPUT_PUBLISH"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              ref="refs/tags/$tag"     # rebuild an existing release
            else
              ref="$GITHUB_SHA"
            fi
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"; ref="$GITHUB_REF"; publish=true
          else
            tag=""; ref="$GITHUB_SHA"; publish=false   # release-test/* dry run
          fi
          if [ -n "$tag" ]; then
            have=$(git show "$ref:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
            [ "v$have" = "$tag" ] || fail "$tag does not match Cargo.toml version $have at $ref; bump Cargo.toml first"
          fi
          case "$tag" in
            *-*) prerelease=true ;;  # v0.5.3-alpha.1, -beta.1, -rc.1: no tap/bucket updates
            *) prerelease=false ;;
          esac
          {
            echo "tag=$tag"; echo "ref=$ref"; echo "publish=$publish"; echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=release plan::${tag:-dry run} from $ref (publish=$publish, prerelease=$prerelease)"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc rather than musl: musl's allocator makes the report path
          # 1.7x slower. cargo-zigbuild links against glibc 2.28, so the
          # binaries run on every distribution from 2018 on.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, glibc: "2.28" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, glibc: "2.28" }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          # No cache in a release: a poisoned cache entry would ship.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.glibc
        with:
          python-version: "3.13"
      - name: cargo-zigbuild
        if: matrix.glibc
        run: pip install ziglang cargo-zigbuild
      - name: Build
        env:
          # Windows: link the C runtime statically, so the .exe runs on a
          # machine without the Visual C++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
          # The zig linker warns about an optimisation flag rustc passes; lint
          # warnings are enforced by ci.yml, not here.
          CARGO_BUILD_WARNINGS: warn
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --locked --bin compara --target ${{ matrix.target }}.${{ matrix.glibc }}
          else
            cargo build --release --locked --bin compara --target ${{ matrix.target }}
          fi
      - name: Smoke test (native targets)
        if: "!contains(matrix.target, 'x86_64-apple') || runner.arch == 'X64'"
        run: |
          bin=target/${{ matrix.target }}/release/compara
          "$bin" --version
          printf 'id,v\nk1,a\nk2,b\n' > a.csv && printf 'id,v\nk1,a\nk2,c\n' > b.csv
          code=0; "$bin" compare a.csv b.csv -k id --summary || code=$?
          [ "$code" = 1 ]
      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/compara-${{ matrix.target }}.tar.gz compara
          (cd dist && shasum -a 256 compara-${{ matrix.target }}.tar.gz > compara-${{ matrix.target }}.tar.gz.sha256)
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/compara-${{ matrix.target }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/release/compara.exe -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  compara-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      # Signed build provenance for every archive: `gh attestation verify
      # <file> -R <owner>/<repo>`. (Public repositories only on GitHub's
      # free plans.)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF: ${{ needs.plan.outputs.ref }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Creates the tag on the planned commit when it doesn't exist yet.
            case "$REF" in refs/*) target="$GITHUB_SHA" ;; *) target="$REF" ;; esac
            flags="--title \"$TAG\" --generate-notes --target \"$target\""
            [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
            eval gh release create \"$TAG\" -R \"$GITHUB_REPOSITORY\" $flags
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          echo "::notice title=release::$TAG published with $(ls dist | wc -l) files: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

  # The container image, from the Linux binaries above: ghcr.io/<repo> for
  # linux/amd64 and linux/arm64, tagged with the version, major.minor and
  # `latest` (a prerelease gets only its version), with build provenance and
  # an SBOM. A dry run builds and tests it without pushing.
  image:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: dist-*-unknown-linux-gnu
          merge-multiple: true
      - name: Binaries by architecture
        run: |
          set -eu
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; triple=${pair#*:}-unknown-linux-gnu
            mkdir -p "image-dist/$arch"
            tar -xzf "artifacts/compara-$triple.tar.gz" -C "image-dist/$arch"
          done
          ls -la image-dist/*
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' && needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.tag != '' && needs.plan.outputs.prerelease == 'false' }}
            type=sha,enable=${{ needs.plan.outputs.tag == '' }}
      - name: Build for this runner, to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: dist=image-dist
          platforms: linux/amd64
          load: true
          tags: compara:test
      - name: Test the image
        run: |
          set -eu
          docker image ls compara:test --format '{{.Size}}' | sed 's/^/size: /'
          docker run --rm compara:test --version
          docker run --rm --memory 512m --cpus 1 compara:test env
          # Read-only root, the non-root user, the inputs on a read-only volume.
          set +e
          docker run --rm --read-only --tmpfs /tmp -v "$PWD/examples:/data:ro" compara:test \
            compare orders_2026-08.csv orders_2026-09.csv -k order_id,line_no -i updated_at --json -
          code=$?
          set -e
          [ "$code" = 1 ] || { echo "::error title=image::compare exited $code, not 1"; exit 1; }
          # Standard input, gzipped.
          gzip -c examples/orders_2026-08.csv | docker run --rm -i -v "$PWD/examples:/data:ro" \
            compara:test compare - orders_2026-09.csv -k order_id,line_no -i updated_at || [ $? = 1 ]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both architectures
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: dist=image-dist
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: needs.plan.outputs.publish == 'true' && !github.event.repository.private
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  packages:
    needs: [plan, build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # The packaging script comes from this workflow's commit; the version,
      # description, README and license from the release ref (which is an
      # older tag when a release is rebuilt).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: meta
        env:
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          mkdir -p release-ref
          for f in Cargo.toml README.md LICENSE; do git show "$REF:$f" > "release-ref/$f" 2>/dev/null || rm -f "release-ref/$f"; done
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          pkg = tomllib.load(open("release-ref/Cargo.toml", "rb"))["package"]
          print(f"version={pkg['version']}")
          print(f"description={pkg['description']}")
          print(f"keywords={','.join(pkg.get('keywords', []))}")
          EOF
      - name: Build npm packages, wheels, Homebrew formula and Scoop manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}
          KEYWORDS: ${{ steps.meta.outputs.keywords }}
        run: |
          for kind in npm wheel homebrew scoop; do
            python3 packaging/package.py "$kind" --name compara --version "$VERSION" --dist dist --out pkg \
              --repo "$GITHUB_REPOSITORY" --description "$DESCRIPTION" --keywords "$KEYWORDS" \
              --readme release-ref/README.md --license-file release-ref/LICENSE
          done
          for dir in pkg/npm/*/; do (cd "$dir" && npm pack --silent); done
      - name: Install and run them
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pkg/wheels/*manylinux*x86_64*.whl
          /tmp/venv/bin/compara --version
          /tmp/venv/bin/pip install --quiet twine && /tmp/venv/bin/twine check pkg/wheels/*.whl
          mkdir /tmp/npm-test && cd /tmp/npm-test && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/pkg/npm/compara-linux-x64/*.tgz "$GITHUB_WORKSPACE"/pkg/npm/compara/*.tgz
          npx compara --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: pkg/

  crates:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable
          cache: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          if curl -sfA "github.com/$GITHUB_REPOSITORY" "https://crates.io/api/v1/crates/compara/$VERSION" >/dev/null; then
            echo "::notice title=crates.io::compara $VERSION is already published"
          else
            cargo publish --locked
          fi

  npm:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - env:
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          # Platform packages first: the main package depends on them.
          for dir in $(ls -d pkg/npm/*/ | grep -v '/compara/$') pkg/npm/compara/; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::notice title=npm::$name $VERSION is already published"
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done

  pypi:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: pkg
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pkg/wheels
          skip-existing: true

  taps:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.prerelease != 'true' && (vars.HOMEBREW_TAP != '' || vars.SCOOP_BUCKET != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: pkg
      - env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          SCOOP_BUCKET: ${{ vars.SCOOP_BUCKET }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          git config --global user.name "andrey-usa"
          git config --global user.email "62624421+andrey-usa@users.noreply.github.com"
          update() {  # repo, source file, path in repo
            [ -n "$1" ] || return 0
            d="tap-$(basename "$1")"
            git clone -q "https://x-access-token:$GH_TOKEN@github.com/$1.git" "$d"
            mkdir -p "$(dirname "$d/$3")" && cp "$2" "$d/$3"
            cd "$d"
            git add "$3"
            git diff --cached --quiet || { git commit -qm "compara $VERSION" && git push -q; }
            cd - >/dev/null
          }
          update "$HOMEBREW_TAP" pkg/compara.rb Formula/compara.rb
          update "$SCOOP_BUCKET" pkg/compara.json bucket/compara.json
