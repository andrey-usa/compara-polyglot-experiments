name: attach-return

# Reproduction: does `navigera -s job start --attach` return on Windows, or
# hang with the session server listening? Three attach forms —
#   (a) user-data-dir, (b) single-tab ws://.../devtools/page/<id>,
#   (c) bare port (resolves via /json/version) —
# 3 attempts each, from pwsh, cmd and Git Bash (27 runs). Every attempt is a
# DIRECT call in the step's shell under a 60 s watchdog (kills navigera.exe
# at 62 s unless the attempt wrote its .done file); `navigera -s job
# tab-list` runs ~10 s in; `navigera -s job quit` gets 15 s; stdout/stderr,
# session log and tab-list output are saved as artifacts. The pwsh job
# additionally narrows a hang (Start-Process vs direct call, console vs
# redirected output).
#
# Deviations from the original observation setup:
# - Chrome gets a FIXED --remote-debugging-port (19022) instead of port 0,
#   because the single-tab and port forms need a discoverable port.
# - Current Chrome (156, verified locally headed+headless and on the
#   runner) does NOT write DevToolsActivePort into the user-data-dir any
#   more. The workflow synthesizes the file from /json/version (port +
#   browser path), exactly what older Chrome wrote, so the user-data-dir
#   discovery path is genuinely exercised. The missing file itself is a
#   finding: see the report.
# - Chrome on the runner occasionally dies between steps; every attempt
#   re-verifies /json/version first and relaunches + re-synthesizes when
#   needed (self-healing), so attempts only run against a live browser.

on:
  push:
    branches: [experiment-21]
    paths:
      - "navigera/**"
      - ".github/workflows/attach-return.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    name: "attach-return ${{ matrix.shell }}"
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, cmd, bash]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CDP_PORT: "19022"
      CHROME_EXE: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Build navigera
        working-directory: navigera
        run: cargo build --release --locked

      - name: Confirm CLI syntax (pwsh)
        if: matrix.shell == 'pwsh'
        run: |
          & "$env:GITHUB_WORKSPACE\navigera\target\release\navigera.exe" -s job start --help
      - name: Confirm CLI syntax (cmd)
        if: matrix.shell == 'cmd'
        run: '"%GITHUB_WORKSPACE%\navigera\target\release\navigera.exe" -s job start --help'
      - name: Confirm CLI syntax (bash)
        if: matrix.shell == 'bash'
        run: '"$GITHUB_WORKSPACE/navigera/target/release/navigera.exe" -s job start --help'

      - name: Prepare log dir
        if: matrix.shell == 'pwsh'
        run: New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\attach-logs" | Out-Null
      - name: Prepare log dir
        if: matrix.shell == 'cmd'
        run: mkdir "%RUNNER_TEMP%\attach-logs" 2>nul & exit /b 0
      - name: Prepare log dir
        if: matrix.shell == 'bash'
        run: mkdir -p "$RUNNER_TEMP/attach-logs"

      - name: Start Chrome with remote debugging (pwsh)
        if: matrix.shell == 'pwsh'
        run: |
          & $env:CHROME_EXE --version
          $profile = "$env:RUNNER_TEMP\chrome-profile"
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Start-Process -FilePath $env:CHROME_EXE -ArgumentList @(
            "--remote-debugging-port=$env:CDP_PORT",
            "--user-data-dir=$profile",
            "--no-first-run", "about:blank")
          for ($i=0; $i -lt 60; $i++) {
            try { (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:CDP_PORT/json/version" -TimeoutSec 2).StatusCode | Out-Null; break }
            catch { Start-Sleep 1 }
          }
          $v = Invoke-RestMethod "http://127.0.0.1:$env:CDP_PORT/json/version"
          Write-Host "browser: $($v.Browser)"
          Write-Host "chrome PIDs: $((Get-Process chrome -ErrorAction SilentlyContinue).Id -join ',')"

      - name: Start Chrome with remote debugging (cmd)
        if: matrix.shell == 'cmd'
        run: |
          @echo off
          setlocal enabledelayedexpansion
          "%CHROME_EXE%" --version
          taskkill /F /IM chrome.exe >nul 2>&1
          timeout /t 2 /nobreak >nul
          start "" "%CHROME_EXE%" --remote-debugging-port=%CDP_PORT% --user-data-dir=%RUNNER_TEMP%\chrome-profile --no-first-run about:blank
          set CHROME_UP=0
          for /L %%i in (1,1,60) do (
            if !CHROME_UP! equ 0 (
              curl -sf --max-time 5 -o nul http://127.0.0.1:%CDP_PORT%/json/version >nul 2>&1
              if !ERRORLEVEL! equ 0 (set CHROME_UP=1) else (timeout /t 1 /nobreak >nul)
            )
          )
          if !CHROME_UP! equ 0 (
            echo CHROME DID NOT COME UP
            exit /b 1
          )
          curl -s --max-time 5 http://127.0.0.1:%CDP_PORT%/json/version | head -c 300
          echo.
          tasklist /FI "IMAGENAME eq chrome.exe" /FO TABLE | head -6

      - name: Start Chrome with remote debugging (bash)
        if: matrix.shell == 'bash'
        run: |
          "$CHROME_EXE" --version
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
          sleep 2
          CHROME_WIN=$(cygpath -w "$CHROME_EXE")
          PROFILE_WIN=$(cygpath -w "$RUNNER_TEMP/chrome-profile")
          cmd.exe /c start '""' "\"$CHROME_WIN\"" --remote-debugging-port="$CDP_PORT" --user-data-dir="\"$PROFILE_WIN\"" --no-first-run about:blank
          for i in $(seq 1 60); do
            curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$CDP_PORT/json/version" && break
            sleep 1
          done
          curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$CDP_PORT/json/version" || { echo "CHROME DID NOT COME UP"; exit 1; }
          curl -s --max-time 5 "http://127.0.0.1:$CDP_PORT/json/version" | head -c 300; echo
          tasklist //FI "IMAGENAME eq chrome.exe" //FO TABLE | head -6

      # 27 runs: 3 forms x 3 shells x 3 attempts. ensure_chrome() re-verifies
      # /json/version before every attempt and relaunches + re-synthesizes
      # DevToolsActivePort + re-picks the page target when Chrome died, so
      # attempts only run against a live browser.
      - name: Run attempts (pwsh)
        if: matrix.shell == 'pwsh'
        run: |
          $nav = "$env:GITHUB_WORKSPACE\navigera\target\release\navigera.exe"
          $logd = "$env:RUNNER_TEMP\attach-logs"
          $profile = "$env:RUNNER_TEMP\chrome-profile"
          $wsfile = "$logd\pagews.txt"
          function Ensure-Chrome {
            $up = $false
            try { (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:CDP_PORT/json/version" -TimeoutSec 5).StatusCode | Out-Null; $up = $true } catch {}
            if ($up -and (Test-Path $wsfile) -and (Test-Path "$profile\DevToolsActivePort")) { return }
            if (-not $up) {
              Write-Host "chrome not responding; (re)launching"
              Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep 2
              Start-Process -FilePath $env:CHROME_EXE -ArgumentList @(
                "--remote-debugging-port=$env:CDP_PORT",
                "--user-data-dir=$profile",
                "--no-first-run", "about:blank")
              for ($i=0; $i -lt 60; $i++) {
                try { (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:CDP_PORT/json/version" -TimeoutSec 2).StatusCode | Out-Null; break }
                catch { Start-Sleep 1 }
              }
            }
            $v = Invoke-RestMethod "http://127.0.0.1:$env:CDP_PORT/json/version"
            $path = $v.webSocketDebuggerUrl -replace '^ws://[^/]+',''
            "$env:CDP_PORT`r`n$path`r`n" | Out-File -Encoding ascii -NoNewline "$profile\DevToolsActivePort"
            $ws = python -c "import json,urllib.request; items=json.load(urllib.request.urlopen('http://127.0.0.1:$env:CDP_PORT/json/list',timeout=10)); print(next(t['webSocketDebuggerUrl'] for t in items if t.get('type')=='page'))"
            $ws | Out-File -Encoding ascii -NoNewline $wsfile
            Write-Host "chrome ready; DevToolsActivePort synthesized; pagews=$ws"
          }
          Ensure-Chrome
          $summary = @()
          foreach ($form in @('dir','url','port')) {
            for ($n=1; $n -le 3; $n++) {
              Ensure-Chrome
              $pagews = (Get-Content $wsfile -Raw).Trim()
              $attach = switch ($form) {
                'dir'  { "$env:RUNNER_TEMP\chrome-profile" }
                'url'  { $pagews }
                'port' { $env:CDP_PORT }
              }
              $tag = "pwsh-$form-$n"
              $out="$logd\$tag.out"; $err="$logd\$tag.err"; $tl="$logd\$tag.tablist"
              $done="$logd\$tag.done"; $killed="$logd\$tag.killed"
              Remove-Item $done,$killed -ErrorAction SilentlyContinue
              "started $(Get-Date -Format o)`nattach=$attach" | Out-File "$logd\$tag.meta"
              $wd = Start-Job -ScriptBlock {
                param($d,$k) Start-Sleep 62
                if (-not (Test-Path $d)) { 'killed' | Out-File $k; Get-Process navigera -ErrorAction SilentlyContinue | Stop-Process -Force }
              } -ArgumentList $done,$killed
              $tlj = Start-Job -ScriptBlock {
                param($n,$f) Start-Sleep 10; & $n -s job tab-list > $f 2>&1; $LASTEXITCODE | Out-File "$f.rc"
              } -ArgumentList $nav,$tl
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              & $nav -s job start --attach "$attach" > $out 2> $err
              $rc = $LASTEXITCODE
              $sw.Stop()
              '' | Out-File $done
              Wait-Job $tlj -Timeout 60 | Out-Null
              $tlrc = if (Test-Path "$tl.rc") { (Get-Content "$tl.rc" -Raw).Trim() } else { 'missing' }
              Remove-Job $wd,$tlj -Force -ErrorAction SilentlyContinue
              $hang = Test-Path $killed
              $elapsed = [int]$sw.Elapsed.TotalSeconds
              "elapsed=${elapsed}s rc=$rc hang=$hang tablist_rc=$tlrc" | Out-File "$logd\$tag.meta" -Append
              $slog = "$env:TEMP\navigera\job.log"
              if (Test-Path $slog) { Copy-Item $slog "$logd\$tag.session.log" }
              $qj = Start-Job -ScriptBlock { param($n) & $n -s job quit > $null 2>&1 } -ArgumentList $nav
              $qdone = Wait-Job $qj -Timeout 15
              Remove-Job $qj -Force -ErrorAction SilentlyContinue
              "quit_returned_15s=$($qdone -ne $null)" | Out-File "$logd\$tag.meta" -Append
              Get-Process navigera -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep 2
              $summary += "$tag elapsed=${elapsed}s rc=$rc hang=$hang tablist_rc=$tlrc"
              Write-Host "$tag elapsed=${elapsed}s rc=$rc hang=$hang tablist_rc=$tlrc"
            }
          }
          $summary | Out-File "$logd\summary-pwsh.txt"
          exit 0

      - name: Run attempts (cmd)
        if: matrix.shell == 'cmd'
        run: |
          @echo off
          setlocal enabledelayedexpansion
          set NAV=%GITHUB_WORKSPACE%\navigera\target\release\navigera.exe
          set LOGD=%RUNNER_TEMP%\attach-logs
          set PROFILE=%RUNNER_TEMP%\chrome-profile
          call :ensure_chrome
          if !ERRORLEVEL! neq 0 exit /b 1
          for %%F in (dir url port) do (
            for /L %%N in (1,1,3) do call :attempt %%F %%N
          )
          exit /b 0
          :ensure_chrome
          curl -sf --max-time 5 -o nul http://127.0.0.1:%CDP_PORT%/json/version
          if %ERRORLEVEL% neq 0 goto :relaunch
          if not exist "%LOGD%\pagews.txt" goto :synthesize
          if not exist "%PROFILE%\DevToolsActivePort" goto :synthesize
          goto :chrome_ok
          :relaunch
          echo (re)launching chrome
          taskkill /F /IM chrome.exe >nul 2>&1
          timeout /t 2 /nobreak >nul
          start "" "%CHROME_EXE%" --remote-debugging-port=%CDP_PORT% --user-data-dir=%PROFILE% --no-first-run about:blank
          set CHROME_UP=0
          for /L %%i in (1,1,60) do (
            if !CHROME_UP! equ 0 (
              curl -sf --max-time 5 -o nul http://127.0.0.1:%CDP_PORT%/json/version >nul 2>&1
              if !ERRORLEVEL! equ 0 (set CHROME_UP=1) else (timeout /t 1 /nobreak >nul)
            )
          )
          if !CHROME_UP! equ 0 (
            echo CHROME DID NOT COME UP
            exit /b 1
          )
          :synthesize
          for /f "tokens=*" %%u in ('python -c "import json,urllib.request; v=json.load(urllib.request.urlopen('http://127.0.0.1:%CDP_PORT%/json/version',timeout=10)); print(v['webSocketDebuggerUrl'])"') do set WSURL=%%u
          set TMP1=%WSURL:*//=%
          set WSPATH=%TMP1:*/=%
          (echo %CDP_PORT%& echo /%WSPATH%) > "%PROFILE%\DevToolsActivePort"
          python -c "import json,urllib.request; items=json.load(urllib.request.urlopen('http://127.0.0.1:%CDP_PORT%/json/list',timeout=10)); print(next(t['webSocketDebuggerUrl'] for t in items if t.get('type')=='page'))" > "%LOGD%\pagews.txt"
          set /p PAGE_WS=<"%LOGD%\pagews.txt"
          echo chrome ready; type "%PROFILE%\DevToolsActivePort"
          :chrome_ok
          set /p PAGE_WS=<"%LOGD%\pagews.txt" 2>nul
          exit /b 0
          :attempt
          set FORM=%~1
          set N=%~2
          call :ensure_chrome
          if "!FORM!"=="dir" (set ATTACH=%PROFILE%) else if "!FORM!"=="url" (set ATTACH=!PAGE_WS!) else (set ATTACH=%CDP_PORT%)
          set TAG=cmd-!FORM!-!N!
          set DONE=%LOGD%\!TAG!.done
          set KILLED=%LOGD%\!TAG!.killed
          if exist "!DONE!" del "!DONE!"
          if exist "!KILLED!" del "!KILLED!"
          echo started %DATE% %TIME% > "%LOGD%\!TAG!.meta"
          echo attach=!ATTACH! >> "%LOGD%\!TAG!.meta"
          start "" /min cmd /c "timeout /t 62 /nobreak >nul & if not exist ""!DONE!"" (echo killed>""!KILLED!"" & taskkill /F /IM navigera.exe >nul 2>&1)"
          start "" /b cmd /c "timeout /t 10 /nobreak >nul & ""%NAV%"" -s job tab-list > ""%LOGD%\!TAG!.tablist"" 2>&1 & (call echo RC=%%errorlevel%%) > ""%LOGD%\!TAG!.tablist.rc"""
          "%NAV%" -s job start --attach "!ATTACH!" > "%LOGD%\!TAG!.out" 2> "%LOGD%\!TAG!.err"
          set RC=%ERRORLEVEL%
          echo. > "!DONE!"
          if exist "!KILLED!" (set HANG=true) else (set HANG=false)
          set /p TLRC=<"%LOGD%\!TAG!.tablist.rc"
          if not defined TLRC set TLRC=missing
          echo rc=!RC! hang=!HANG! tablist_rc=!TLRC! >> "%LOGD%\!TAG!.meta"
          if exist "%TEMP%\navigera\job.log" copy /y "%TEMP%\navigera\job.log" "%LOGD%\!TAG!.session.log" >nul
          start "" /b cmd /c """%NAV%"" -s job quit >nul 2>&1"
          set NAVGONE=0
          for /L %%w in (1,1,15) do (
            if !NAVGONE! equ 0 (
              tasklist /FI "IMAGENAME eq navigera.exe" 2>nul | find /I "navigera.exe" >nul
              if !ERRORLEVEL! neq 0 (set NAVGONE=1) else (timeout /t 1 /nobreak >nul)
            )
          )
          taskkill /F /IM navigera.exe >nul 2>&1
          echo quit settled >> "%LOGD%\!TAG!.meta"
          timeout /t 2 /nobreak >nul
          echo !TAG! rc=!RC! hang=!HANG! tablist_rc=!TLRC!
          exit /b 0

      - name: Run attempts (bash)
        if: matrix.shell == 'bash'
        run: |
          set -u
          NAV="$GITHUB_WORKSPACE/navigera/target/release/navigera.exe"
          LOGD="$RUNNER_TEMP/attach-logs"
          PROFILE="$RUNNER_TEMP/chrome-profile"
          WSFILE="$LOGD/pagews.txt"
          ensure_chrome() {
            if curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$CDP_PORT/json/version" && [ -f "$WSFILE" ] && [ -f "$PROFILE/DevToolsActivePort" ]; then return 0; fi
            echo "(re)launching chrome"
            taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
            sleep 2
            CHROME_WIN=$(cygpath -w "$CHROME_EXE")
            PROFILE_WIN=$(cygpath -w "$PROFILE")
            cmd.exe /c start '""' "\"$CHROME_WIN\"" --remote-debugging-port="$CDP_PORT" --user-data-dir="\"$PROFILE_WIN\"" --no-first-run about:blank
            for i in $(seq 1 60); do
              curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$CDP_PORT/json/version" && break
              sleep 1
            done
            curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$CDP_PORT/json/version" || { echo "CHROME DID NOT COME UP"; return 1; }
            WS=$(python -c "import json,urllib.request; v=json.load(urllib.request.urlopen('http://127.0.0.1:$CDP_PORT/json/version',timeout=10)); print(v['webSocketDebuggerUrl'])")
            x="${WS#*//}"; WSPATH="/${x#*/}"
            printf '%s\n%s\n' "$CDP_PORT" "$WSPATH" > "$PROFILE/DevToolsActivePort"
            WS=$(python -c "import json,urllib.request; items=json.load(urllib.request.urlopen('http://127.0.0.1:$CDP_PORT/json/list',timeout=10)); print(next(t['webSocketDebuggerUrl'] for t in items if t.get('type')=='page'))")
            printf '%s' "$WS" > "$WSFILE"
            echo "chrome relaunched; pagews=$WS"
          }
          ensure_chrome
          for form in dir url port; do
            for n in 1 2 3; do
              ensure_chrome
              PAGE_WS=$(cat "$WSFILE")
              case "$form" in
                dir) ATTACH="$PROFILE" ;;
                url) ATTACH="$PAGE_WS" ;;
                port) ATTACH="$CDP_PORT" ;;
              esac
              tag="bash-$form-$n"
              done_f="$LOGD/$tag.done"; killed_f="$LOGD/$tag.killed"
              rm -f "$done_f" "$killed_f"
              { echo "started $(date -u +%FT%TZ)"; echo "attach=$ATTACH"; } > "$LOGD/$tag.meta"
              ( sleep 62; if [ ! -f "$done_f" ]; then echo killed > "$killed_f"; taskkill //F //IM navigera.exe >/dev/null 2>&1; fi ) &
              ( sleep 10; "$NAV" -s job tab-list >"$LOGD/$tag.tablist" 2>&1; echo $? > "$LOGD/$tag.tablist.rc" ) &
              t0=$(date +%s)
              rc=0; "$NAV" -s job start --attach "$ATTACH" >"$LOGD/$tag.out" 2>"$LOGD/$tag.err" || rc=$?
              t1=$(date +%s)
              touch "$done_f"
              if [ -f "$killed_f" ]; then hang=true; else hang=false; fi
              tlrc=$(cat "$LOGD/$tag.tablist.rc" 2>/dev/null || echo missing)
              echo "elapsed=$((t1-t0))s rc=$rc hang=$hang tablist_rc=$tlrc" >> "$LOGD/$tag.meta"
              [ -f "$TEMP/navigera/job.log" ] && cp "$TEMP/navigera/job.log" "$LOGD/$tag.session.log"
              ("$NAV" -s job quit >/dev/null 2>&1 || true) &
              sleep 15
              taskkill //F //IM navigera.exe >/dev/null 2>&1 || true
              echo "quit settled" >> "$LOGD/$tag.meta"
              sleep 2
              echo "$tag elapsed=$((t1-t0))s rc=$rc hang=$hang tablist_rc=$tlrc"
            done
          done

      # Narrowing (always runs; cheap, and is the evidence either way):
      # Start-Process vs direct call on the user-data-dir form, plus a
      # direct call with output going to the console (not redirected).
      - name: Narrow the hang (pwsh)
        if: matrix.shell == 'pwsh'
        run: |
          $nav = "$env:GITHUB_WORKSPACE\navigera\target\release\navigera.exe"
          $logd = "$env:RUNNER_TEMP\attach-logs"
          $profile = "$env:RUNNER_TEMP\chrome-profile"
          $dir = $profile
          try { (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:CDP_PORT/json/version" -TimeoutSec 5).StatusCode | Out-Null }
          catch {
            Start-Process -FilePath $env:CHROME_EXE -ArgumentList @(
              "--remote-debugging-port=$env:CDP_PORT",
              "--user-data-dir=$profile",
              "--no-first-run", "about:blank")
            Start-Sleep 20
            $v = Invoke-RestMethod "http://127.0.0.1:$env:CDP_PORT/json/version" -TimeoutSec 10
            $path = $v.webSocketDebuggerUrl -replace '^ws://[^/]+',''
            "$env:CDP_PORT`r`n$path`r`n" | Out-File -Encoding ascii -NoNewline "$profile\DevToolsActivePort"
          }
          # V1: Start-Process (the form the original observation used), 60 s budget
          $tag = "narrow-startprocess-dir"
          $proc = Start-Process -FilePath $nav -ArgumentList @('-s','job','start','--attach',$dir) -NoNewWindow -PassThru -RedirectStandardOutput "$logd\$tag.out" -RedirectStandardError "$logd\$tag.err"
          $tlj = Start-Job -ScriptBlock { param($n,$f) Start-Sleep 10; & $n -s job tab-list > $f 2>&1; $LASTEXITCODE | Out-File "$f.rc" } -ArgumentList $nav,"$logd\$tag.tablist"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $exited = $proc.WaitForExit(60000)
          $sw.Stop()
          if (-not $exited) { $proc.Kill() }
          Wait-Job $tlj -Timeout 60 | Out-Null
          $tlrc = if (Test-Path "$logd\$tag.tablist.rc") { (Get-Content "$logd\$tag.tablist.rc" -Raw).Trim() } else { 'missing' }
          Remove-Job $tlj -Force -ErrorAction SilentlyContinue
          "startprocess elapsed=$([int]$sw.Elapsed.TotalSeconds)s returned_within_60s=$exited tablist_rc=$tlrc" | Out-File "$logd\$tag.meta"
          Write-Host "startprocess elapsed=$([int]$sw.Elapsed.TotalSeconds)s returned=$exited tablist_rc=$tlrc"
          & $nav -s job quit > $null 2>&1
          Get-Process navigera -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          # V2: direct call, stdout/stderr to the console (no redirect)
          $tag = "narrow-direct-console-dir"
          $done="$logd\$tag.done"; $killed="$logd\$tag.killed"
          Remove-Item $done,$killed -ErrorAction SilentlyContinue
          $wd = Start-Job -ScriptBlock { param($d,$k) Start-Sleep 62; if (-not (Test-Path $d)) { 'killed' | Out-File $k; Get-Process navigera -ErrorAction SilentlyContinue | Stop-Process -Force } } -ArgumentList $done,$killed
          $tlj = Start-Job -ScriptBlock { param($n,$f) Start-Sleep 10; & $n -s job tab-list > $f 2>&1; $LASTEXITCODE | Out-File "$f.rc" } -ArgumentList $nav,"$logd\$tag.tablist"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & $nav -s job start --attach $dir
          $rc = $LASTEXITCODE
          $sw.Stop()
          '' | Out-File $done
          Wait-Job $tlj -Timeout 60 | Out-Null
          $tlrc = if (Test-Path "$logd\$tag.tablist.rc") { (Get-Content "$logd\$tag.tablist.rc" -Raw).Trim() } else { 'missing' }
          Remove-Job $wd,$tlj -Force -ErrorAction SilentlyContinue
          $hang = Test-Path $killed
          "direct_console elapsed=$([int]$sw.Elapsed.TotalSeconds)s rc=$rc hang=$hang tablist_rc=$tlrc" | Out-File "$logd\$tag.meta"
          Write-Host "direct_console elapsed=$([int]$sw.Elapsed.TotalSeconds)s rc=$rc hang=$hang tablist_rc=$tlrc"
          & $nav -s job quit > $null 2>&1
          Get-Process navigera -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0

      - name: Stop Chrome
        if: always() && matrix.shell == 'pwsh'
        run: Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Stop Chrome
        if: always() && matrix.shell == 'cmd'
        run: taskkill /F /IM chrome.exe >nul 2>&1 & exit /b 0
      - name: Stop Chrome
        if: always() && matrix.shell == 'bash'
        run: taskkill //F //IM chrome.exe >/dev/null 2>&1 || true

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attach-return-${{ matrix.shell }}
          path: ${{ runner.temp }}\attach-logs\
          if-no-files-found: warn

      - name: Summary
        if: always() && matrix.shell == 'pwsh'
        run: |
          '## attach-return (pwsh)' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:RUNNER_TEMP\attach-logs\summary-pwsh.txt") {
            Get-Content "$env:RUNNER_TEMP\attach-logs\summary-pwsh.txt" >> $env:GITHUB_STEP_SUMMARY
          }
          '```' >> $env:GITHUB_STEP_SUMMARY
