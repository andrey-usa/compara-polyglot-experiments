name: Lint

permissions:
  contents: read

# The measurement scripts and the port test suites are what the published
# numbers and the "all checks pass" claims rest on. FINDINGS.md traces
# several wrong results to a fault in a harness rather than in a port, so the
# harnesses get the checks the ports' own source gets.
#
#   ruff        scripts/*.py            (pyproject.toml)
#   shellcheck  scripts/*.sh and every port's test.sh, warnings and up

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "*/test.sh"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "*/test.sh"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: ruff and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: ruff
        run: |
          pip install --quiet ruff==0.15.8
          ruff check scripts
      # shellcheck is on the runner image. `--version` in the log says which,
      # because a new release finding something in old code should be readable
      # as that and not as a regression. Warnings and up: style-level notes (a
      # `$` on an arithmetic variable, `A && B || C`) are left to the author,
      # while a failed `cd`, an unused variable and a loop that cannot run twice
      # are not. (.shellcheckrc has no severity setting, hence the flag.)
      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S warning scripts/*.sh */test.sh
