name: publish-t0047

# T-0047 result recovery lane (agent fb).
#
# The paid eval workflows upload their raw output as artifacts, but agent
# sandboxes cannot download artifacts (that API always needs auth), so when a
# publish step inside an eval job dies the numbers would otherwise be stuck in
# an artifact. This lane runs in CI, where the repo token can read its own
# artifacts: it downloads the queued artifact, re-runs the same summarizing
# code, writes a diagnostics log and commits the results to experiment-44 -
# the destination the eval workflows publish to.
#
# Trigger: add or change a queue entry under publish/jobs/*.txt on this branch.
# Each phase (probe, download, summarize, publish) is its own CI step and
# pushes its log to experiment-44, so a phase that dies is both visible as a
# failed step and readable over git.
#
# Nothing this workflow writes matches the eval workflows' trigger paths
# (bench/miniwob/**, bench/webarena/**, bench/agent-eval/**, their own workflow
# files), so it never starts paid work; it only touches bench/t0047-*/**
# and publish/**.

on:
  push:
    branches: [t0047-publish]
    paths:
      - "publish/jobs/**"
      - "publish/recover.sh"
      - ".github/workflows/publish-t0047.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-t0047
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: experiment-44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: "1. probe: gh, token, push rights"
        env:
          PHASE: probe
        run: bash publish/recover.sh
      - name: "2. download the queued artifacts"
        env:
          PHASE: download
        run: bash publish/recover.sh
      - name: "3. summarize them"
        env:
          PHASE: summarize
        run: bash publish/recover.sh
      - name: "4. publish the results"
        env:
          PHASE: publish
        run: bash publish/recover.sh
