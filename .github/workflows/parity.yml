name: Cross-language parity

permissions:
  contents: read

# One dataset, every native port, the same answer.
#
# This used to build five implementations -- Python, Java, TypeScript, Go and
# Rust -- and spent most of its wall clock installing toolchains for engines the
# project no longer competes on. It now asks the narrower question that is still
# capable of failing: do the byte-level ports agree, on a file none of them
# generated for themselves?
#
# The dataset comes from c/gen-data, which is the cheapest generator to build
# here and writes the same bytes as every other one -- which c/test.sh
# --with-ports checks, so this job does not have to.

on:
  push:
    # `main` only. Every branch here gets a pull request, and a branch listed
    # beside it means each push runs this workflow twice on the same SHA -- once
    # for the push, once for the pull_request -- which the per-ref concurrency
    # group cannot collapse, because a push is `refs/heads/...` and a pull
    # request is `refs/pull/N/merge`. Two different groups, two full runs. The
    # `pull_request` trigger below covers the branch; this one covers what
    # landed.
    branches: [main]
    paths:
      - "c/**"
      - "cpp/**"
      - "rust/src/**"
      - "zig/src/**"
      - ".github/workflows/parity.yml"
  # The same paths as the push above. This used to be a bare `pull_request:`,
  # which meant every pull request built all four ports to compare them --
  # including one that changed only a Markdown file, which spent 2m11s proving that
  # documentation does not affect the counts.
  pull_request:
    paths:
      - "c/**"
      - "cpp/**"
      - "rust/src/**"
      - "zig/src/**"
      - ".github/workflows/parity.yml"
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: one dataset, every native port
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Zig
        uses: ./.github/actions/setup-zig

      # Zig cross-compiles without a second toolchain, so keeping the macOS
      # claim in README.md true costs one step rather than an inference from
      # the source. It was an inference, and it was wrong in both directions:
      # the port did build for macOS, and the line the README blamed for it not
      # building -- `std.os.linux.clock_gettime` -- compiles there and then
      # emits Linux syscall numbers on a kernel that does not use them, which is
      # the worse of the two failures.
      #
      # This runs before the host build on purpose: a cross build overwrites
      # zig-out/bin/csvdiff, and the steps below execute it.
      - name: Zig cross-compiles for macOS
        run: |
          cd zig
          for target in aarch64-macos x86_64-macos; do
            echo "::group::$target"
            zig build --release=fast -Dtarget="$target"
            echo "::endgroup::"
          done

      # Four ports at once rather than one after another; see
      # scripts/build_ports.sh for why that is 2-4x on a four-core runner.
      - name: Build the native ports
        run: scripts/build_ports.sh c c-gen cpp cpp-gen rust-full zig

      # Before the readers are asked anything, because if the generators
      # disagree then the readers are being asked about different files.
      #
      # Nothing checked this. This job generates one dataset with `c/gen-data`
      # and compares what the readers say about it, which is a different claim,
      # and `c/test.sh --with-ports` compares C against C++ and stops there. So
      # the Rust generator and the Python one had never been byte-compared to
      # anything -- and a real divergence was sitting in that gap. See the
      # script's KNOWN list.
      - name: Every generator writes the same bytes
        run: python3 scripts/generator_parity.py --rows 200k | tee -a "$GITHUB_STEP_SUMMARY"

      - name: One dataset, from the C generator
        run: |
          mkdir -p data
          c/gen-data --rows 200k --out-dir data --prefix p
          c/gen-data --rows 200k --out-dir data --prefix p --format json
          c/gen-data --rows 200k --out-dir data --prefix p --format parquet
          # The C generator writes no TSV. The Rust one writes the same rows as
          # the CSV above (generator_parity.py holds the two to the byte), with a
          # tab between fields, and every port takes the separator from the
          # header line -- so the TSV pair must give the CSV answer everywhere.
          rust/target/release/compara-gen-data --rows 200k --out-dir data --prefix p --format tsv

      # Each port is asked for every format it reads. A port that refuses a
      # format is skipped by name rather than counted as agreeing with everyone.
      - name: Every port, every format it reads
        run: |
          set -u
          KEY="-k account_id,txn_id -i updated_at"
          run() { # name, format, then the argv
            local name=$1 fmt=$2; shift 2
            if "$@" $KEY --json "/tmp/$name.$fmt.json" >/dev/null 2>&1 || [ $? -le 1 ]; then :; fi
            [ -s "/tmp/$name.$fmt.json" ] || rm -f "/tmp/$name.$fmt.json"
          }
          for fmt in csv tsv ndjson unc.parquet; do
            a="data/p_a.$fmt"; b="data/p_b.$fmt"
            run c    "$fmt" c/csvdiff compare "$a" "$b"
            run cpp  "$fmt" cpp/build/csvdiff compare "$a" "$b"
            # No --engine: that flag is the one thing that retires the columnar
            # Parquet reader, so naming it here left the reader `auto` actually
            # picks -- the one a user gets on an uncompressed Parquet pair --
            # never checked against the other three ports. Both readers are
            # checked now; the extra run costs a second and they both have to
            # agree with C, C++ and Zig.
            run rust "$fmt" rust/target/release/compara compare "$a" "$b" -o /dev/null
            run rust-turbo "$fmt" rust/target/release/compara compare "$a" "$b" \
              --engine turbo -o /dev/null
            run zig  "$fmt" zig/zig-out/bin/csvdiff compare "$a" "$b"
          done
          python3 - <<'PY'
          import glob, json, sys, collections
          by_fmt = collections.defaultdict(dict)
          for path in sorted(glob.glob("/tmp/*.json")):
              name = path.split("/")[-1]
              port, fmt = name.split(".", 1)
              by_fmt[fmt[:-5]][port] = json.load(open(path))
          bad = 0
          for fmt, ports in sorted(by_fmt.items()):
              if len(ports) < 2:
                  print(f"{fmt}: only {list(ports)} read it")
                  continue
              ref_name, ref = sorted(ports.items())[0]
              for port, got in sorted(ports.items()):
                  for section in ("counts", "columns"):
                      if got.get(section) != ref.get(section):
                          print(f"::error::{fmt}: {port} {section} differ from {ref_name}")
                          bad = 1
              print(f"{fmt}: {len(ports)} ports agree -- {', '.join(sorted(ports))}")
          # A separator is not a format: TSV has to give the CSV answer itself,
          # not merely agree with itself across ports.
          for port, got in sorted(by_fmt.get("tsv", {}).items()):
              ref = by_fmt.get("csv", {}).get(port)
              if ref is None:
                  continue
              for section in ("counts", "columns"):
                  if got.get(section) != ref.get(section):
                      print(f"::error::tsv: {port} {section} differ from its own csv answer")
                      bad = 1
          sys.exit(bad)
          PY
