name: Interactions

# navigera (the copy in `navigera/`): the interaction fixes -- frames and
# shadow roots, covered and moving elements, selects, the element wait,
# downloads, right clicks -- with the whole suite, on the runner's own Chrome
# on Linux, macOS and Windows. Results are annotations: `interactions <os>`.

on:
  push:
    branches: [experiment-29]
    paths:
      - "navigera/**"
      - ".github/workflows/interactions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "interactions ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: navigera
    env:
      NAVIGERA_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Chrome
        run: |
          case "$RUNNER_OS" in
            Linux) google-chrome --version ;;
            macOS) "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version ;;
            Windows) ls "/c/Program Files/Google/Chrome/Application/" ;;
          esac
      - name: What can be handed over
        run: cargo run --quiet --locked -- profiles --pretty
      - name: Tests
        run: |
          set +e -o pipefail
          # A watchdog under the job's timeout: a hung test is killed and named
          # in the annotation (the job log isn't readable from everywhere).
          cat > watchdog.py <<'PY'
          import os, signal, subprocess, sys
          log, limit, cmd = sys.argv[1], int(sys.argv[2]), sys.argv[3:]
          with open(log, "w", encoding="utf-8", errors="replace") as f:
              p = subprocess.Popen(cmd, stdout=f, stderr=subprocess.STDOUT, start_new_session=(os.name != "nt"))
              try:
                  code = p.wait(timeout=limit)
              except subprocess.TimeoutExpired:
                  if os.name != "nt":
                      os.killpg(p.pid, signal.SIGKILL)
                  else:
                      p.kill()
                  p.wait()
                  code = 124
                  f.write(f"\nWATCHDOG: killed after {limit} s\n")
          sys.stdout.write(open(log, encoding="utf-8", errors="replace").read())
          sys.exit(code)
          PY
          if [ "$RUNNER_OS" = Linux ]; then
            # A display for `show`.
            run_tests() { python3 watchdog.py "$1" "$2" xvfb-run -a cargo test --locked --no-fail-fast "${@:3}"; }
          else
            # macOS runners have 3 cores: three tests at once, each with its
            # own Chrome, put the load average at 50-80 and pages stop
            # answering for 35 s and more. Two at a time.
            if [ "$RUNNER_OS" = macOS ]; then export RUST_TEST_THREADS=2; fi
            run_tests() { python3 watchdog.py "$1" "$2" cargo test --locked --no-fail-fast --lib --test interactions --test handoff --test attach --test commands --test fork --test verify_scopes "${@:3}"; }
          fi
          run_tests test.log 1500
          code=$?
          # A test that failed is run once more on its own: one that passes
          # then is a flake (reported as FLAKY, not a failure), one that
          # fails again is a failure.
          : > retry.log
          if [ $code -ne 0 ] && ! grep -q "WATCHDOG: killed" test.log; then
            failed=$(grep -oE "^test [^ ]+ \.\.\. FAILED" test.log | awk '{print $2}' | sort -u)
            if [ -n "$failed" ]; then
              RUST_TEST_THREADS=1 run_tests retry.log 900 -- --exact $failed
              [ $? -eq 0 ] && code=0
            fi
          fi
          python3 - test.log "interactions $RUNNER_OS" retry.log <<'PY'
          import re, sys
          WATCH = {"a_covered_element_is_not_clicked_unless_forced", "locators_reach_into_same_origin_frames",
                   "downloads_are_saved_and_waited_for", "a_click_waits_for_a_sliding_modal_to_settle"}
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          passed = sum(int(m) for m in re.findall(r"test result: \w+\. (\d+) passed", text))
          failed = re.findall(r"^test (\S+) \.\.\. FAILED", text, re.M)
          ran = re.findall(r"^test (\S+) \.\.\. (ok|FAILED)", text, re.M)
          handoff = [f"{n}: {r}" for n, r in ran if r == "FAILED" or n in WATCH]
          panics = re.findall(r"panicked at .*?\n(.*?)\n", text, re.S)
          retry = open(sys.argv[3], encoding="utf-8", errors="replace").read() if len(sys.argv) > 3 else ""
          again = set(re.findall(r"^test (\S+) \.\.\. FAILED", retry, re.M))
          passed_retry = set(re.findall(r"^test (\S+) \.\.\. ok", retry, re.M))
          flaky = [f for f in failed if f in passed_retry]
          failed = [f for f in failed if f not in passed_retry]
          passed += len(flaky)
          msg = f"{passed} passed, {len(failed)} failed {failed}" + (f", FLAKY (passed on retry) {flaky}" if flaky else "") + "\n" + "\n".join(handoff)
          slow = re.findall(r"^test (\S+) has been running for over \d+ seconds", text, re.M)
          if slow:
              msg += "\nslow: " + ", ".join(slow)
          if "WATCHDOG: killed" in text:
              msg += "\nWATCHDOG killed the run; last lines:\n" + "\n".join(text.strip().splitlines()[-25:])
          if panics:
              msg += "\n" + "\n".join(p[:600] for p in panics[:4])
          print(f"::notice title={sys.argv[2]}::" + msg[:3800].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          exit $code
