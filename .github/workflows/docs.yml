name: Docs

permissions:
  contents: read

# The README's promise is that every command runs from a fresh clone. This holds
# the references between the documents to the same standard, and keeps the
# benchmark log from growing back into one 7,500-line file.
#
#   check_links.py         every relative Markdown link and #anchor resolves
#   archive_benchmarks.py  BENCHMARKS.md stays under its line budget; when it
#                          does not, run the script and commit what it moves

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check_links.py"
      - "scripts/archive_benchmarks.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_links.py"
      - "scripts/archive_benchmarks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: links and the benchmark log
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Relative links resolve
        run: python3 scripts/check_links.py
      - name: BENCHMARKS.md is within its budget
        run: python3 scripts/archive_benchmarks.py --check
