# T-0071: primavera M4 exit — container bench, primavera image vs the
# Playwright image. No registry pushes; nothing in primavera/ is changed.
# This file exists only on branch experiment-34, so a push trigger here
# fires only for that branch's push.
name: T-0071 container bench

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build primavera image (small context)
        run: |
          rm -rf /tmp/pvctx && mkdir -p /tmp/pvctx
          cp -r navigera primavera /tmp/pvctx/
          cp primavera/Dockerfile /tmp/pvctx/Dockerfile
          docker build -f /tmp/pvctx/Dockerfile -t primavera:local /tmp/pvctx

      - name: Build Playwright image (suite pw/ + deps in the image)
        run: |
          rm -rf /tmp/pwctx && mkdir -p /tmp/pwctx
          cp primavera/bench/suite40/pw/package.json \
             primavera/bench/suite40/pw/package-lock.json /tmp/pwctx/
          cp -r primavera/bench/suite40/pw/tests \
                 primavera/bench/suite40/pw/fixtures.mjs \
                 primavera/bench/suite40/pw/playwright.config.mjs /tmp/pwctx/
          mkdir -p /tmp/pwctx/fixtures
          cp primavera/bench/suite40/fixtures/upload.txt /tmp/pwctx/fixtures/
          cat > /tmp/pwctx/Dockerfile <<'DOCKER'
          FROM mcr.microsoft.com/playwright:v1.64.1-noble
          WORKDIR /work
          COPY package.json package-lock.json ./
          RUN npm ci --no-audit --no-fund
          COPY tests ./tests
          COPY fixtures.mjs playwright.config.mjs ./
          COPY fixtures /fixtures
          DOCKER
          docker build -t pw:local /tmp/pwctx

      - name: Image sizes and layers
        run: |
          for img in primavera:local pw:local; do
            echo "== $img"
            docker image inspect "$img" \
              --format 'uncompressed_bytes={{.Size}} layers={{len .RootFS.Layers}}'
            echo -n "compressed_bytes=$(docker save "$img" | gzip -c | wc -c)"
            echo
            docker history --quiet "$img" | wc -l
          done | tee image-sizes.log

      - name: Run the bench (5 reps, both tools, 1+4 workers, constrained leg)
        run: |
          chmod +x .github/t0071/bench.sh
          bash .github/t0071/bench.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0071-container-bench-${{ matrix.os }}
          path: |
            bench.log
            image-sizes.log
            site.out
            gauntlet.out
            out/
          if-no-files-found: warn
