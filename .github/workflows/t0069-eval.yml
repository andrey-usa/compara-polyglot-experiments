# T-0069 primavera M3 exit eval (experiment-38). PAID RUN: armed only by pushing the bench/t0069/RUN
# sentinel; one sentinel push per approved run. Owner authorization for uncapped spend
# within this finite 72-trial scope was given on the owner's own channel (recorded
# in the private board notes); this file documents scope, it does not grant it.
# The harness WAL (reserve/settle/unknown) accounts every request.
#
# PRIVACY MODEL (public repo: Actions logs and artifacts are world-visible):
# - Job logs carry status lines only. Harness stdout/stderr (scores, costs,
#   prompts, episodes, ledgers) is redirected to files and NEVER printed.
# - Results travel as an ENCRYPTED artifact (encrypt-then-MAC): a unique
#   unpredictable 512-bit per-bundle key (independent 256-bit AES-256-CBC data
#   key + 256-bit HMAC-SHA256 key), HMAC computed over wrapped-key || bundle,
#   the bundle key RSA-OAEP-SHA256-wrapped to bench/t0069/ci-results-pub.pem.
#   The private unwrap key lives only in the private board repo. No decryption
#   material, no board-write credential, and no repo secret beyond the existing
#   environment-scoped SILICONFLOW_API_KEY leaves the runner. Anyone
#   downloading the public artifact gets ciphertext + tag only.
# - SILICONFLOW_API_KEY isolation: the harness pops it from its environment at
#   startup, never puts it in any child env (including the site server), and
#   every model-generated shell command plus every scoring run of model-written
#   code executes as the dedicated unprivileged user `benchr`
#   (sudo -n -u benchr env -i ...), so no credential-bearing process is
#   reachable from model code. Env filtering alone is NOT treated as
#   sufficient: same-uid /proc/<pid>/environ would otherwise expose the key.
# - The zero-spend `preflight` job runs the seeded-solution self-test through
#   the exact restricted-user path on both arms and gates all paid jobs.
# - BOUNDED EXECUTION: 4 slices/arm = 9 trials per eval job (worst case
#   9 x 30-min trial cap = 270 min + overhead < 360-min job timeout), and the
#   harness stops STARTING trials 30 min before a 300-min wall budget, finishing
#   the in-flight trial and recording deferred trials for an exact-once resume
#   in a later dispatch. Results never depend on post-timeout always() steps:
#   GitHub forcibly terminates cancelled/timed-out jobs after a 5-minute grace
#   (workflow cancellation reference), so the run is designed to finish well
#   before any platform timeout.
# - Checkouts use persist-credentials: false; workflow permissions are read-only.
name: T-0069 M3 exit eval
permissions:
  contents: read
# NOTE: workflow_dispatch only resolves workflows on the DEFAULT branch; this
# orphan branch's workflow is therefore armed by a push that touches
# bench/t0069/RUN (the sentinel). One sentinel push = one explicit paid run;
# ordinary code pushes to this branch do NOT trigger the eval.
on:
  push:
    branches: [experiment-38]
    paths: [bench/t0069/RUN]
  workflow_dispatch:
    inputs:
      slice_mod:
        description: "deterministic slices per arm (matrix must match)"
        default: "4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: andrey-usa/primavera, ref: 7026c8031967e0fa146b04e2f2a6e2092e359302, path: primavera, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: andrey-usa/navigera, ref: cc300d30f2fa72896c522fadc50293db7a38bdc7, path: navigera, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: t0069, workspaces: primavera }
      - name: build primavera (navigera is compiled in) at pinned commits
        run: |
          cargo build --release --manifest-path primavera/Cargo.toml
          ./primavera/target/release/primavera --version
          sha256sum primavera/target/release/primavera
      - uses: actions/upload-artifact@v4
        with: { name: primavera-bin, path: primavera/target/release/primavera, retention-days: 1 }

  preflight:
    # Zero model spend: seeded-solution self-test through the full toolchain,
    # including restricted-user execution, on both arms. Gates the paid eval.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [primavera, playwright]
    steps:
      - uses: actions/checkout@v4
        with: { path: experiments, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: primavera-bin, path: bin }
      - run: chmod 755 bin bin/primavera
      - name: create restricted bench user
        run: sudo useradd benchr || true
      - name: stage bench tree outside runner home (least-privilege - benchr needs no /home/runner traversal)
        run: |
          sudo mkdir -p /opt/t0069
          sudo cp -a bin /opt/t0069/bin
          sudo cp -a experiments/bench/t0069 /opt/t0069/bench
          sudo chmod -R a+rX /opt/t0069
          sudo chown -R runner:runner /opt/t0069
          echo "== staged symlinks resolving back through runner home (must be empty) =="
          find /opt/t0069 -type l -print0 | while IFS= read -r -d '' l; do \
            t=$(readlink -f "$l" 2>/dev/null || echo UNRESOLVABLE)
            case "$t" in /home/runner/*|UNRESOLVABLE) echo "BACK-REF $l -> $t";; esac
          done
          echo "(check complete)"
      - name: arm B toolchain (playwright, shared browser path)
        if: matrix.arm == 'playwright'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          sudo mkdir -p /opt/pw-browsers && sudo chmod 777 /opt/pw-browsers
          sudo mkdir -p /opt/t0069/pw && sudo chown runner:runner /opt/t0069/pw
          cd /opt/t0069/pw && npm init -y >/dev/null 2>&1 && npm i @playwright/test@1.64.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo chmod -R a+rX /opt/pw-browsers /opt/t0069/pw
          echo "== pw/browsers symlinks resolving back through runner home (must be empty) =="
          find /opt/t0069/pw /opt/pw-browsers -type l -print0 | while IFS= read -r -d '' l; do \
            t=$(readlink -f "$l" 2>/dev/null || echo UNRESOLVABLE)
            case "$t" in /home/runner/*|UNRESOLVABLE) echo "BACK-REF $l -> $t";; esac
          done
          echo "(check complete)"
          echo "pw ready: $(npx playwright --version)"
      - name: staged-tree traversal + exec forensics as the bench user (verifies least-privilege layout)
        run: |
          echo "== staged modes + every path component (must NOT cross /home/runner) =="
          stat -c '%a %U:%G %n' /opt/t0069/bin /opt/t0069/bin/primavera || true
          namei -l /opt/t0069/bin/primavera || true
          echo "== trivial staged script as benchr =="
          printf '#!/bin/sh\necho benchr-staged-exec-ok\n' | sudo tee /opt/t0069/bin/probe.sh >/dev/null && sudo chmod 755 /opt/t0069/bin/probe.sh
          sudo -n -u benchr env -i HOME=/tmp TERM=dumb LANG=C.UTF-8 /opt/t0069/bin/probe.sh 2>&1 || true
          echo "== the actual primavera binary as benchr (staged path) =="
          sudo -n -u benchr env -i HOME=/tmp TERM=dumb LANG=C.UTF-8 /opt/t0069/bin/primavera --version 2>&1 | tail -3 || true
          echo "== confirm benchr still CANNOT traverse runner home (negative control) =="
          sudo -n -u benchr env -i HOME=/tmp ls "$GITHUB_WORKSPACE" 2>&1 | tail -1 || true
      - name: browser facts (non-sensitive; identifies the shared-layer failure class)
        run: |
          echo "== runner chrome candidates =="
          which google-chrome google-chrome-stable chromium chromium-browser 2>/dev/null || true
          google-chrome --version 2>/dev/null || echo "no system google-chrome"
          echo "== userns/apparmor policy (ubuntu 24.04 restricts unprivileged userns) =="
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "sysctl key absent"
          echo "== system chrome as the bench user (about:blank DOM or launch error) =="
          sudo -n -u benchr env -i HOME=/tmp TERM=dumb LANG=C.UTF-8             google-chrome --headless=new --no-first-run --dump-dom about:blank 2>&1 | tail -3 || true
      - name: bundled chromium as the bench user (playwright arm; about:blank or launch error)
        if: matrix.arm == 'playwright'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          cd /opt/t0069/pw
          sudo -n -u benchr env -i HOME=/tmp TERM=dumb LANG=C.UTF-8             PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers PATH="$PATH" \
            npx playwright screenshot about:blank /tmp/pw-probe.png 2>&1 | tail -3 || true
      - name: self-test via restricted user (stdout to file; status lines only)
        env:
          ARM: ${{ matrix.arm }}
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          cd /opt/t0069/bench
          sudo mkdir -p /opt/t0069/out && sudo chown runner:runner /opt/t0069/out
          python3 harness-t0069_run.py --arm "$ARM" --self-test \
            --as-user benchr \
            --primavera-bin /opt/t0069/bin/primavera --pw-dir /opt/t0069/pw \
            --out /opt/t0069/out/preflight-$ARM > /opt/t0069/out/preflight-$ARM.log 2>&1
          tail -2 /opt/t0069/out/preflight-$ARM.log
      - name: gate on expected self-test scores
        run: python3 experiments/bench/t0069/preflight-check.py --arm ${{ matrix.arm }} --out /opt/t0069/out
      - name: encrypt preflight diagnostics (ciphertext + tag only leave the runner)
        if: always()
        env:
          ARM: ${{ matrix.arm }}
        run: |
          umask 077
          cd /opt/t0069
          mkdir -p /tmp/upload-diag
          sudo tar czf "/tmp/preflight-$ARM.tar.gz" \
            --exclude='*/.config' --exclude='*/.local' --exclude='*/.cache' --exclude='*/.npm/_cacache' \
            "out/preflight-$ARM" "out/preflight-$ARM.log"
          sudo chown $(id -u):$(id -g) "/tmp/preflight-$ARM.tar.gz"
          head -c 64 /dev/urandom > /tmp/symkey.bin
          ENCKEYHEX=$(head -c32 /tmp/symkey.bin | od -An -tx1 | tr -d ' \n')
          MACKEYHEX=$(tail -c32 /tmp/symkey.bin | od -An -tx1 | tr -d ' \n')
          head -c16 /dev/urandom > /tmp/iv.bin
          IVHEX=$(od -An -tx1 /tmp/iv.bin | tr -d ' \n')
          openssl enc -aes-256-cbc -K "$ENCKEYHEX" -iv "$IVHEX" \
            -in "/tmp/preflight-$ARM.tar.gz" -out /tmp/cipher.bin
          cat /tmp/iv.bin /tmp/cipher.bin > "/tmp/upload-diag/preflight-$ARM.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey /opt/t0069/bench/ci-results-pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/symkey.bin -out "/tmp/upload-diag/preflight-$ARM.symkey.enc"
          cat "/tmp/upload-diag/preflight-$ARM.symkey.enc" "/tmp/upload-diag/preflight-$ARM.tar.gz.enc" \
            | openssl dgst -sha256 -mac HMAC -macopt hexkey:"$MACKEYHEX" -binary \
            > "/tmp/upload-diag/preflight-$ARM.mac"
          shred -u /tmp/symkey.bin /tmp/iv.bin /tmp/cipher.bin "/tmp/preflight-$ARM.tar.gz"
          echo "preflight diagnostics encrypted (ciphertext + tag only leave this runner)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-diag-${{ matrix.arm }}
          path: /tmp/upload-diag/
          retention-days: 1


  eval:
    needs: [build, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 18 trials/slice x 30-min trial wall cap worst case exceeds 240
    environment: main
    strategy:
      fail-fast: false
      matrix:
        arm: [primavera, playwright]
        slice: [0, 1, 2, 3]
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SLICE_MOD: ${{ github.event.inputs.slice_mod || '4' }}
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    steps:
      - uses: actions/checkout@v4
        with: { path: experiments, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: primavera-bin, path: bin }
      - run: chmod 755 bin bin/primavera
      - name: create restricted bench user
        run: sudo useradd benchr || true
      - name: stage bench tree outside runner home (least-privilege - benchr needs no /home/runner traversal)
        run: |
          sudo mkdir -p /opt/t0069
          sudo cp -a bin /opt/t0069/bin
          sudo cp -a experiments/bench/t0069 /opt/t0069/bench
          sudo chmod -R a+rX /opt/t0069
          sudo chown -R runner:runner /opt/t0069
      - name: arm B toolchain (playwright, shared browser path)
        if: matrix.arm == 'playwright'
        run: |
          sudo mkdir -p /opt/pw-browsers && sudo chmod 777 /opt/pw-browsers
          sudo mkdir -p /opt/t0069/pw && sudo chown runner:runner /opt/t0069/pw
          cd /opt/t0069/pw && npm init -y >/dev/null 2>&1 && npm i @playwright/test@1.64.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo chmod -R a+rX /opt/pw-browsers /opt/t0069/pw
          echo "pw ready: $(npx playwright --version)"
      - name: run slice (stdout/stderr to files only)
        env:
          ARM: ${{ matrix.arm }}
          SLICE: ${{ matrix.slice }}
        run: |
          cd /opt/t0069/bench
          RUNTAG="ci-${{ github.run_id }}-${{ matrix.arm }}-s${{ matrix.slice }}"
          sudo mkdir -p /opt/t0069/out && sudo chown runner:runner /opt/t0069/out
          mkdir -p "/opt/t0069/out/$RUNTAG"
          set +e
          python3 harness-t0069_run.py --arm "$ARM" --trials 3 \
            --slice-mod "$SLICE_MOD" --slice-index "$SLICE" \
            --as-user benchr --wall-budget-minutes 300 \
            --primavera-bin /opt/t0069/bin/primavera --pw-dir /opt/t0069/pw \
            --out "/opt/t0069/out/$RUNTAG" --uncapped \
            > "/opt/t0069/out/$RUNTAG/harness-stdout.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "/opt/t0069/out/$RUNTAG/exit-code.txt"
          echo "RUNTAG=$RUNTAG" >> "$GITHUB_ENV"
          echo "slice finished: arm=$ARM slice=$SLICE (detail stays off the public log)"
      - name: encrypt results (encrypt-then-MAC; public key only, no secrets here)
        if: always()
        run: |
          umask 077  # symkey/tarball/iv unreadable even to the bench uid during the encrypt window
          cd /opt/t0069
          mkdir -p /tmp/upload
          sudo tar czf "/tmp/${RUNTAG}.tar.gz" \
            --exclude='*/.config' --exclude='*/.local' --exclude='*/.cache' --exclude='*/.npm/_cacache' \
            "out/${RUNTAG}"
          sudo chown $(id -u):$(id -g) "/tmp/${RUNTAG}.tar.gz"
          head -c 64 /dev/urandom > /tmp/symkey.bin
          ENCKEYHEX=$(head -c32 /tmp/symkey.bin | od -An -tx1 | tr -d ' \n')
          MACKEYHEX=$(tail -c32 /tmp/symkey.bin | od -An -tx1 | tr -d ' \n')
          head -c16 /dev/urandom > /tmp/iv.bin
          IVHEX=$(od -An -tx1 /tmp/iv.bin | tr -d ' \n')
          openssl enc -aes-256-cbc -K "$ENCKEYHEX" -iv "$IVHEX" \
            -in "/tmp/${RUNTAG}.tar.gz" -out /tmp/cipher.bin
          cat /tmp/iv.bin /tmp/cipher.bin > "/tmp/upload/${RUNTAG}.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey /opt/t0069/bench/ci-results-pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/symkey.bin -out "/tmp/upload/${RUNTAG}.symkey.enc"
          cat "/tmp/upload/${RUNTAG}.symkey.enc" "/tmp/upload/${RUNTAG}.tar.gz.enc" \
            | openssl dgst -sha256 -mac HMAC -macopt hexkey:"$MACKEYHEX" -binary \
            > "/tmp/upload/${RUNTAG}.mac"
          shred -u /tmp/symkey.bin /tmp/iv.bin /tmp/cipher.bin "/tmp/${RUNTAG}.tar.gz"
          echo "results encrypted (ciphertext + tag only leave this runner)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.arm }}-s${{ matrix.slice }}
          path: /tmp/upload/
          retention-days: 1
      - name: propagate recorded benchmark result
        if: always()
        run: |
          RC=$(cat "/opt/t0069/out/${RUNTAG}/exit-code.txt" 2>/dev/null || echo 99)
          echo "slice exit code: $RC (decrypted results carry the detail)"
          exit "$RC"
