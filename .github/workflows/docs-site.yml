# Docs site: build the three-product Starlight site, check it, run
# every product's Quick start as written. Deliberately NOT a Pages
# deploy: the site is a CI artifact for inspection, and publishing is
# the owner's call.
name: Docs site

on:
  workflow_dispatch:
  push:
    branches:
      - experiment-42

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            docs-site/starlight/package-lock.json
            docs-site/checks/package-lock.json
      - uses: actions/checkout@v4
        with:
          repository: andrey-usa/navigera
          ref: ba37ede
          path: product-repos/navigera
      - uses: actions/checkout@v4
        with:
          repository: andrey-usa/compara
          ref: f3274c7
          path: product-repos/compara
      - uses: actions/checkout@v4
        with:
          repository: andrey-usa/primavera
          ref: fa3fe34
          path: product-repos/primavera
      - name: Sync content and verify it matches the branch
        run: |
          cd docs-site
          python3 sync-site.py --navigera ../product-repos/navigera \
            --compara ../product-repos/compara \
            --primavera ../product-repos/primavera > /tmp/sync.json
          git status --porcelain -- starlight/src/content/docs | tee /tmp/diff.txt
          test ! -s /tmp/diff.txt || (echo "site content drifted from pinned sources" && exit 1)
      - name: Build the site
        run: |
          npm --prefix docs-site/starlight ci
          npm --prefix docs-site/starlight run build
      - name: 'Link check (no allowlist: 0 broken)'
        run: python3 docs-site/check-links.py docs-site/starlight/dist
      - name: Axe and Pagefind search checks
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm --prefix docs-site/checks ci
          node docs-site/checks/check-site.mjs docs-site/starlight/dist
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/starlight/dist

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: andrey-usa/navigera
          ref: session-history
          path: work/navigera
      - uses: actions/checkout@v4
        with:
          repository: andrey-usa/primavera
          ref: next
          path: work/primavera
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: navigera quick start (as written on the site page)
        run: |
          npm install -g navigera
          navigera -s qs start --headless
          navigera -s qs goto https://example.com
          navigera -s qs ax --raw | tee /tmp/navigera-ax.txt
          grep -q "Example Domain" /tmp/navigera-ax.txt
          navigera -s qs quit
      - name: compara quick start (as written on the site page)
        run: |
          npm install -g compara
          printf 'id,amount\n1,10\n2,20\n' > a.csv
          printf 'id,amount\n1,10\n2,20\n' > b.csv
          compara compare a.csv b.csv -k id
          printf 'id,amount\n1,10\n2,25\n' > b.csv
          set +e
          compara compare a.csv b.csv -k id -o report.html
          test $? -eq 1
          test -s report.html
      - name: primavera quick start (as written on the site page)
        run: |
          cd work/primavera && cargo build --release && cd ..
          mkdir -p tests
          cat > tests/smoke.pv << 'EOF'
          base https://example.com

          scenario "The example page loads"
            goto /
            expect text "Example Domain"
          EOF
          ./primavera/target/release/primavera run tests
