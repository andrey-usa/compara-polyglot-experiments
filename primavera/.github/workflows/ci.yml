name: ci

# primavera's tests (parser, reports, the examples against navigera's bench
# site and primavera's own fixture site) and the 40-scenario suite, on
# Linux, macOS and Windows with the runner's Chrome, built against the
# navigera branch checked out beside it (`../navigera`).

on:
  push:
    branches: [next]
  pull_request:
  workflow_dispatch:
    inputs:
      navigera:
        description: "navigera branch or commit to build against"
        default: "session-history"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAVIGERA_REF: ${{ inputs.navigera || 'session-history' }}

jobs:
  test:
    name: "primavera ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: primavera
    env:
      PRIMAVERA_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          path: primavera
      - uses: actions/checkout@v7
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: compara (for `expect download … compare`)
        continue-on-error: true
        run: python -m pip install --quiet compara && compara --version
      - name: Tests
        run: |
          set +e -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          python3 - test.log "primavera $RUNNER_OS" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          passed = sum(int(m) for m in re.findall(r"test result: \w+\. (\d+) passed", text))
          failed = re.findall(r"^test (\S+) \.\.\. FAILED", text, re.M)
          panics = re.findall(r"panicked at .*?\n(.*?)\n", text, re.S)
          msg = f"{passed} passed, {len(failed)} failed {failed}"
          if panics:
              msg += "\n" + "\n".join(p[:900] for p in panics[:4])
          print(f"::notice title={sys.argv[2]}::" + msg[:3800].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          exit $code
      - name: The 40-scenario suite
        if: always()
        run: |
          set +e -uo pipefail
          S=bench/suite40
          python3 $S/site/server.py --port 18001 > site40.out 2>&1 &
          python3 $S/gauntlet/server.py --port 18201 --xo-port 18202 --seed 7 --jitter 0 --telemetry 1 > gauntlet.out 2>&1 &
          for _ in $(seq 150); do
            curl -sf -o /dev/null http://127.0.0.1:18001/ && curl -sf -o /dev/null http://127.0.0.1:18202/xo-form && break
            sleep 0.2
          done
          [ -x target/debug/primavera ] || cargo build --locked
          export GAUNTLET_URL=http://127.0.0.1:18201
          ./target/debug/primavera run $S/pv --base-url http://127.0.0.1:18001 --workers 4 \
            --repeat 3 --shuffle --junit suite40.xml 2>&1 | tee suite40.log
          code=${PIPESTATUS[0]}
          tally=$(grep -E "^[0-9]+ passed" suite40.log | tail -1)
          flaky=$(grep -cE "^FLAKY" suite40.log)
          echo "::notice title=primavera suite40 $RUNNER_OS::40 scenarios x3, 4 workers, shuffled: ${tally:-no tally} (flaky: $flaky)"
          exit $code

  action:
    # The GitHub Action as a workflow uses it: no release yet, so it builds
    # primavera from this commit (navigera beside it), then runs a file
    # against the 40-scenario suite's site.
    name: "the action (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: primavera
      - uses: actions/checkout@v7
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The site, and a file to run
        shell: bash
        run: |
          python3 primavera/bench/suite40/site/server.py --port 18001 > site.out 2>&1 &
          for _ in $(seq 150); do curl -sf -o /dev/null http://127.0.0.1:18001/ && break; sleep 0.2; done
          mkdir -p t
          printf 'scenario "The shop opens"\n  goto /\n  expect url ends-with /shop\n  expect title contains Acme\n  expect lcp < 10s\n  expect no errors\n' > t/shop.pv
      - id: pv
        uses: ./primavera
        with:
          paths: t
          base-url: http://127.0.0.1:18001
          args: --junit t/report.xml
      - name: What it left
        shell: bash
        env:
          EVIDENCE: ${{ steps.pv.outputs.evidence }}
        run: |
          grep -q 'tests="1"' t/report.xml && grep -q 'failures="0"' t/report.xml
          echo "evidence: $EVIDENCE"

  container:
    # The image (Dockerfile) on amd64 and arm64, run the way the Kubernetes
    # example runs it: another uid, read-only root, no capabilities, the
    # tests mounted, against the 40-scenario suite's site.
    name: "the image (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: primavera
      - uses: actions/checkout@v7
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
      - name: Build
        run: |
          docker build -f primavera/Dockerfile -t primavera:ci .
          docker image ls primavera:ci --format 'image {{.Size}}'
      - name: Run
        run: |
          python3 primavera/bench/suite40/site/server.py --port 18001 > site.out 2>&1 &
          for _ in $(seq 150); do curl -sf -o /dev/null http://127.0.0.1:18001/ && break; sleep 0.2; done
          mkdir -p t out && chmod 777 out
          printf 'scenario "The shop opens"\n  goto /\n  expect url ends-with /shop\n  expect title contains Acme\n  expect lcp < 10s\n' > t/shop.pv
          start=$(date +%s%N)
          docker run --rm --network host --user 12345 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp --shm-size 512m -e HOME=/tmp \
            -v "$PWD/t:/tests:ro" -v "$PWD/out:/work" \
            primavera:ci run /tests --base-url http://127.0.0.1:18001 --junit /work/junit.xml
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          grep -q 'failures="0"' out/junit.xml
          echo "::notice title=primavera image ${{ matrix.os }}::one scenario, docker run to exit: ${ms} ms"

  lightpanda:
    # The smoke tier: the suite's site scenarios on Lightpanda, but the three
    # that need layout or a second tab (s19 hover, s20 new tab, s25 the
    # request read after the page left).
    name: "lightpanda smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: primavera
    steps:
      - uses: actions/checkout@v7
        with:
          path: primavera
      - uses: actions/checkout@v7
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - name: Lightpanda 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.0.1 --repo lightpanda-io/browser --pattern lightpanda-x86_64-linux --dir "$RUNNER_TEMP/lp"
          chmod +x "$RUNNER_TEMP/lp/lightpanda-x86_64-linux"
          echo "LIGHTPANDA_BIN=$RUNNER_TEMP/lp/lightpanda-x86_64-linux" >> "$GITHUB_ENV"
      - name: Smoke
        env:
          LIGHTPANDA_DISABLE_TELEMETRY: "1"
        run: |
          cargo build --locked
          python3 bench/suite40/site/server.py --port 18001 > site.out 2>&1 &
          for _ in $(seq 150); do curl -sf -o /dev/null http://127.0.0.1:18001/ && break; sleep 0.2; done
          files=$(ls bench/suite40/pv/s*.pv | grep -v -e s19- -e s20- -e s25-)
          ./target/debug/primavera run $files --base-url http://127.0.0.1:18001 --engine lightpanda --workers 4 | tee lp.log
          echo "::notice title=primavera on Lightpanda::$(tail -1 lp.log)"
