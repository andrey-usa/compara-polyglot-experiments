# navigera docs built with MkDocs Material (pinned: mkdocs<2, material 9.7.1).
site_name: navigera docs
# No site_url: keeps all links relative so the built site works from any
# path (including a CI artifact download), and the 404 page resolves.
repo_url: https://github.com/andrey-usa/navigera
theme:
  name: material
  features:
    - content.code.copy
    - navigation.tracking
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
nav:
  - Overview: index.md
  - Reference: reference.md
  - Multi-model: multi-model.md
  - Agent skill: skill.md
