name: bench-contenders

# Weekly: compara vs the latest legit alternatives on one keyed comparison.
# Contenders (all installed fresh, latest versions, each run):
#   compara          — this repo, release build
#   duckdb           — SQL FULL OUTER JOIN + per-column diff (the fast alternative)
#
# Task: two 10M-row x 20-col CSVs, composite key (account_id,txn_id),
# --ignore updated_at. Each contender reports unchanged / changed / added /
# removed keys; the counts must agree or the run fails (correctness gate).
# Every contender gets compara's semantics: values compared as text (an
# empty field equals only an empty field), and a key that appears twice in
# one file is compared by its first row.
# Wall is best of 3, one runner, warm cache.
#
# Table reports wall time only — the number a user feels. CPU and memory
# are in the step summary for the curious.

on:
  workflow_dispatch:
  schedule:
    # Weekly contender check, staggered after navigera/gruppera.
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Build compara (release)
        run: cargo build --release --locked --bin compara --bin compara-gen-data

      - name: Install contenders (latest)
        run: |
          pip install --upgrade duckdb
          python3 -c "import duckdb; print('duckdb', duckdb.__version__)"

      - name: Generate 10M-row pair (Rust)
        run: |
          ./target/release/compara-gen-data --rows 10m --out-dir bench-data --prefix bench
          ls -la bench-data/bench_a.csv bench-data/bench_b.csv

      - name: Benchmark
        run: |
          python3 - <<'EOF'
          import json, subprocess, time

          A = "bench-data/bench_a.csv"
          B = "bench-data/bench_b.csv"
          COMPARE = ["./target/release/compara", "compare", A, B,
                     "-k", "account_id,txn_id", "-i", "updated_at",
                     "--json", "compara-counts.json"]
          KEY = ["account_id", "txn_id"]
          # Compared columns: everything except the key and the ignored column.
          CMP = ["posting_date","value_date","currency","amount","fee","balance",
                 "status","channel","region","branch_code","product_code",
                 "counterparty","quantity","rate","category","risk_flag","note"]

          def run_compara():
              t0 = time.perf_counter()
              r = subprocess.run(COMPARE, capture_output=True, text=True)
              dt = time.perf_counter() - t0
              assert r.returncode in (0, 1), r.stderr[-2000:]
              # compara's `matched` is every key present in both files;
              # `unchanged` is the part of it the others call matched.
              c = json.load(open("compara-counts.json"))["counts"]
              return dt, {"matched": c["unchanged"], "changed": c["changed"],
                          "added": c["added"], "removed": c["removed"]}

          first = f"QUALIFY row_number() OVER (PARTITION BY {', '.join(KEY)} ORDER BY rowid) = 1"
          DUCKDB_SQL = f"""
          CREATE TABLE ra AS SELECT * FROM read_csv('{A}', all_varchar = true);
          CREATE TABLE rb AS SELECT * FROM read_csv('{B}', all_varchar = true);
          CREATE TABLE a AS SELECT * FROM ra {first};
          CREATE TABLE b AS SELECT * FROM rb {first};
          SELECT
            count(*) FILTER (a.account_id IS NOT NULL AND b.account_id IS NOT NULL
                             AND ({{eq}})) AS matched,
            count(*) FILTER (a.account_id IS NOT NULL AND b.account_id IS NOT NULL
                             AND NOT ({{eq}})) AS changed,
            count(*) FILTER (a.account_id IS NULL) AS added,
            count(*) FILTER (b.account_id IS NULL) AS removed
          FROM a FULL OUTER JOIN b
            ON a.account_id = b.account_id AND a.txn_id = b.txn_id;
          """
          eq = " AND ".join(f"a.{c} IS NOT DISTINCT FROM b.{c}" for c in CMP)

          def run_duckdb():
              import duckdb
              t0 = time.perf_counter()
              con = duckdb.connect()
              row = con.execute(DUCKDB_SQL.format(eq=eq)).fetchone()
              dt = time.perf_counter() - t0
              con.close()
              return dt, dict(zip(("matched", "changed", "added", "removed"), row))

          results = {}
          for name, fn in (("compara", run_compara), ("duckdb", run_duckdb)):
              walls, counts = [], None
              for _ in range(3):
                  dt, c = fn()
                  walls.append(dt)
                  counts = c
              results[name] = {"wall_best": min(walls), "walls": walls,
                               "counts": counts}
              print(f"{name}: best {min(walls):.2f}s walls={['%.2f' % w for w in walls]} {counts}",
                    flush=True)

          # Correctness gate: every contender must agree on the counts.
          refs = results["compara"]["counts"]
          for name, r in results.items():
              assert r["counts"] == refs, f"{name} disagrees: {r['counts']} vs {refs}"

          with open("bench-results.json", "w") as f:
              json.dump(results, f, indent=2)
          EOF

      - name: Publish table
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          r = json.load(open("bench-results.json"))
          order = sorted(r, key=lambda n: r[n]["wall_best"])
          lines = ["## bench-contenders — keyed table comparison (10M rows x 20 cols, CSV)",
                   "",
                   "**Task:** `compara compare a.csv b.csv -k account_id,txn_id -i updated_at` equivalent; "
                   "counts gated identical across contenders.",
                   "",
                   "| contender | wall (best of 3) | vs compara |",
                   "|---|---|---|"]
          base = r["compara"]["wall_best"]
          for n in order:
              w = r[n]["wall_best"]
              lines.append(f"| {n} | {w:.2f} s | {w/base:.2f}x |")
          lines += ["",
                    "**Versions:** latest at run time (`pip install --upgrade duckdb`; "
                    "compara built from this ref).",
                    f"**Counts:** {r['compara']['counts']}"]
          out = "\n".join(lines)
          with open("/tmp/bench-table.md", "w") as f:
              f.write(out + "\n")
          print(out)
          EOF
          cat /tmp/bench-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-contenders-results
          path: bench-results.json
