# Only here to configure the linter for scripts/. The ports are not Python
# packages and nothing builds from this file.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default set, written down so that a change of default does not change
# what CI enforces: syntax errors (E9), the statement-layout rules (E4, E7) and
# pyflakes (F). These scripts produce every number the project publishes, and
# the unused import and shadowed name this found are the kind of thing that
# hides in a harness.
select = ["E4", "E7", "E9", "F"]
