[package]
name = "compara"
version = "0.5.3-alpha.1"
edition = "2024"
rust-version = "1.90"
description = "Compare two tables (CSV, NDJSON, Parquet) on a composite key: counts, per-column statistics and a self-contained HTML report."
license = "MIT"
repository = "https://github.com/andrey-usa/compara"
homepage = "https://github.com/andrey-usa/compara"
readme = "README.md"
keywords = ["csv", "parquet", "diff", "compare", "data-quality"]
categories = ["command-line-utilities", "parser-implementations", "development-tools::testing"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/compara.example.toml"]
default-run = "compara"

[lib]
name = "compara"
path = "src/lib.rs"

[[bin]]
name = "compara"
path = "src/main.rs"

[[bin]]
name = "compara-gen-data"
path = "src/bin/gen_data.rs"

[[bin]]
name = "compara-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[features]
# The benchmark harness: `cargo run --release --features bench --bin compara-bench`.
bench = []

[dependencies]
# Engine: native, over the csv crate.
csv = "1.4.0"
# Engine: turbo. Maps the file instead of reading it, so the bytes are paged in
# on demand and evictable rather than held on the heap.
memmap2 = "0.9"
# turbo's Parquet reader decodes its own pages -- snappy and LZ4 are written out
# in the engine, because each is eighty lines of byte copying. These two are not:
# a deflate and a zstd decoder are real programs, and are pulled in for it
# rather than written here.
zstd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
flate2 = "1.1.10"
base64 = "0.23.1"
# Local time with an offset for the report header; std has no calendar.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
